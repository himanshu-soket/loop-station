  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:9px 8px;min-width:0;
}
.cr-ov-stat .k{display:block;font-family:var(--mono);font-size:9px;
  color:var(--ink-faint);text-transform:uppercase;letter-spacing:.11em}
.cr-ov-stat .v{display:block;font-size:17px;font-weight:800;margin-top:3px;
  font-variant-numeric:tabular-nums}

/* Nitro meter under the HUD. */
.cr-meter-row{
  display:flex;align-items:center;gap:10px;justify-content:center;
  margin:2px 0 4px;
}
.cr-meter-k{
  font-family:var(--mono);font-size:9px;color:var(--ink-faint);
  text-transform:uppercase;letter-spacing:.11em;
}
.cr-meter{
  flex:1;max-width:340px;height:10px;border-radius:6px;overflow:hidden;
  background:var(--panel2);border:1px solid var(--line);
}
.cr-meter-fill{
  height:100%;width:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--violet),var(--blue));
  transition:width .12s linear;
}
.cr-meter.ready .cr-meter-fill{
  background:linear-gradient(90deg,var(--acc),var(--blue));
  box-shadow:0 0 10px rgba(94,242,192,.45);
}

/* Touch controls: steer + brake + nitro. */
/* P1: touch pads show only on coarse pointers; keyboard otherwise. */
@media (hover:hover) and (pointer:fine){
  .cr-touch-ov{opacity:.28}
  .cr-touch-ov .cr-pad{pointer-events:none}
  .cr-touch-ov:hover{opacity:1}
  .cr-touch-ov:hover .cr-pad{pointer-events:auto}
}
.cr-pad{
  min-width:64px;min-height:52px;padding:8px 14px;
  font-family:var(--mono);font-size:13px;font-weight:700;
  color:var(--ink-dim);background:var(--panel2);
  border:1px solid var(--line2);border-radius:12px;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
.cr-pad:active{color:var(--ink);border-color:var(--ink-faint)}
.cr-pad.nitro{color:var(--violet);border-color:rgba(180,140,255,.4)}
.cr-pad.drift{color:#5ef2c0;border-color:rgba(94,242,192,.35)}
/* PHASE 1 · phones: six pads in a bottom overlay row is too wide for a
   320–430px stage. They shrink to comfortable ≥44px targets that share
   the row (wrapping to two rows on the narrowest screens), never
   overflowing the stage or covering the player car for long. */
@media (max-width:560px){
  .cr-touch-ov{gap:6px;padding:0 6px;bottom:6px}
  .cr-pad{min-width:0;min-height:46px;padding:6px 10px;font-size:11.5px;
    flex:1 1 0}
  .cr-ctl-overlay{top:6px;right:6px;gap:4px}
  .cr-chip{padding:5px 7px;font-size:11px}
}
@media (max-width:380px){
  .cr-pad{padding:5px 7px;font-size:10.5px}
}

/* Fullscreen notice (same shape as SI's). */
/* Live drift read-out in the HUD: glows while a drift is accruing. */
.cr-drift .si-v, .cr-drift{font-weight:700}
.cr-drift{color:var(--acc);opacity:0;transition:opacity .15s;letter-spacing:.04em}
.cr-drift.on{opacity:1;text-shadow:0 0 12px rgba(94,242,192,.55)}

/* PHASE 4 · combo chain read-out: violet glow while the chain is live. */
.cr-combo{
  color:var(--violet);font-weight:800;letter-spacing:.05em;
  text-shadow:0 0 12px rgba(180,140,255,.6);
  transition:opacity .18s;
}
.cr-combo.hidden{display:none}

/* PHASE 4 · results rating tile: accent-bordered hero stat. */
.cr-ov-rating{border-color:rgba(94,242,192,.4)}
.cr-ov-rating .v{color:var(--acc);text-shadow:0 0 14px rgba(94,242,192,.45)}

/* PHASE 4 · HUD strip may wrap on narrow screens; keep stats compact. */
.cr-hud .si-stat .si-v{font-variant-numeric:tabular-nums}

/* PHASE 1 · phones: compact the racing HUD + nitro meter and fold the
   redundant header so the stage keeps the screen; the control chips and
   touch pads already sit INSIDE the stage overlay. */
@media (max-width:560px){
  body.ft-playing #crPanel .ft-panel-h{display:none}
  body.ft-playing #crPanel{padding:8px 10px 10px;gap:6px}
  .cr-hud{gap:4px}
  .cr-hud .si-stat{padding:3px 6px;gap:4px;border-radius:7px}
  .cr-hud .si-k{font-size:7px;letter-spacing:.05em}
  .cr-hud .si-v{font-size:11.5px}
  .cr-meter-row{margin:0 0 2px;padding:0 2px;gap:6px}
  .cr-meter{height:8px;max-width:none}
  .cr-meter-k{font-size:7.5px}
  .cr-stage{border-radius:10px}
}
@media (max-height:520px) and (orientation:landscape){
  body.ft-playing #crPanel .ft-panel-h{display:none}
  body.ft-playing #crPanel{padding:5px 10px 8px;gap:4px}
  .cr-hud{gap:3px}
  .cr-hud .si-stat{padding:2px 5px;gap:3px;border-radius:6px}
  .cr-hud .si-k{font-size:6.5px;letter-spacing:.03em}
  .cr-hud .si-v{font-size:10.5px}
  .cr-meter-row{margin:0 0 1px;padding:0 2px;gap:5px}
  .cr-meter{height:6px}
  .cr-meter-k{font-size:6.5px}
}

.cr-fs-notice{
  position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
  font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);
  background:rgba(7,9,13,.9);border:1px solid var(--line);
  border-radius:8px;padding:6px 12px;opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:3;white-space:nowrap;
}
.cr-fs-notice.show{opacity:1}


/* ===================== PHASE 6 · menus, garage, records ================ */
/* Menu screens sit inside .cr-overlay; only one is visible at a time. */
.cr-menu{gap:14px}
.cr-menu-btns{display:flex;flex-direction:column;gap:8px;min-width:230px}
.cr-menu-foot{
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);
  letter-spacing:.08em;text-transform:uppercase;
}

/* FULLSCREEN FIX · while ANY menu screen is up (main menu, difficulty,
 * garage, records, championship) the racing HUD strip and the nitro meter
 * row are hidden — they belong to a live race, not the attract scene.
 * `#crPanel.cr-menu-on` is toggled by crScreen()/crScreenHide(). The
 * control chips (.cr-ctl-overlay) live OUTSIDE #crOverlay and are NOT
 * affected: Pause/Restart/Sound/Fullscreen/Exit stay reachable. */
#crPanel.cr-menu-on .cr-hud,
#crPanel.cr-menu-on .cr-meter-row{display:none}
/* PHASE 1 FIX · the touch pads must not sit ON TOP of the menu screens:
 * on short viewports the pad row overlapped the menu buttons and stole
 * their taps. While any menu is up the pads hide; they return the moment
 * a race (or its ready/pause/result overlay) is showing. */
#crPanel.cr-menu-on .cr-touch-ov{display:none}
/* While the HUD rows are hidden the stage takes their place: let it grow
 * so the attract scene fills the panel instead of leaving dead bands. */
#crPanel.cr-menu-on .cr-stage{flex:1 1 auto;min-height:0}
.cr-diff-note{
  font-family:var(--mono);font-size:11px;color:var(--ink-dim);
  max-width:320px;line-height:1.6;
}
.cr-back{align-self:center}

/* Garage: car grid + customizer. */
.cr-garage{max-width:640px;width:100%}
.cr-garage-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;width:100%;
}
.cr-car-card{
  display:flex;flex-direction:column;gap:6px;align-items:center;
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  padding:10px 8px;cursor:pointer;color:inherit;font:inherit;
  transition:border-color .15s, transform .15s, box-shadow .15s;
  position:relative;
}
.cr-car-card:hover{transform:translateY(-2px)}
.cr-car-card.sel{
  border-color:var(--acc);
  box-shadow:0 0 0 1px var(--acc), 0 6px 18px rgba(94,242,192,.14);
}
.cr-car-card.locked{opacity:.55;cursor:not-allowed}
.cr-car-card.locked:hover{transform:none}
.cr-car-name{font-weight:800;font-size:13px;letter-spacing:.02em}
.cr-car-desc{
  font-family:var(--mono);font-size:9.5px;color:var(--ink-dim);
  line-height:1.5;min-height:28px;text-align:center;
}
.cr-car-stats{display:flex;flex-direction:column;gap:3px;width:100%;padding:0 6px}
.cr-car-stats i{display:flex;align-items:center;gap:6px;font-style:normal;
  font-family:var(--mono);font-size:8.5px;color:var(--ink-faint)}
.cr-car-stats b{width:34px;text-transform:uppercase;letter-spacing:.06em}
.cr-car-stats span{
  flex:1;height:4px;border-radius:2px;background:var(--panel);
  overflow:hidden;position:relative;
}
.cr-car-stats span::after{
  content:'';position:absolute;left:0;top:0;bottom:0;width:inherit;
  background:linear-gradient(90deg,var(--acc),var(--blue));border-radius:2px;
}
.cr-car-lock{
  font-family:var(--mono);font-size:9px;color:#ffc857;letter-spacing:.04em;
}
.cr-car-card canvas{width:100%;height:auto}

/* Customization panel. */
.cr-garage-custom{
  width:100%;display:flex;flex-direction:column;gap:8px;
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;
}
.cr-cust-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cr-cust-row>label{
  font-family:var(--mono);font-size:9px;color:var(--ink-faint);
  text-transform:uppercase;letter-spacing:.11em;width:52px;
}
.cr-sw-row{display:flex;gap:6px;flex-wrap:wrap}
.cr-neon-sw{
  width:22px;height:22px;border-radius:50%;border:2px solid transparent;
  cursor:pointer;padding:0;
}
.cr-neon-sw.sel{border-color:#fff;box-shadow:0 0 10px currentColor}
.cr-opt-row{display:flex;gap:6px;flex-wrap:wrap}
.cr-opt-row button, .cr-cust-row button{
  font-family:var(--mono);font-size:10px;padding:5px 10px;border-radius:8px;
  background:var(--panel);border:1px solid var(--line);color:var(--ink-dim);
  cursor:pointer;
}
.cr-opt-row button.sel{
  color:var(--acc);border-color:rgba(94,242,192,.5);
  box-shadow:0 0 8px rgba(94,242,192,.18);
}
.cr-opt-row button.locked{opacity:.5}
#crPlateIn{
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);padding:5px 10px;width:120px;text-transform:uppercase;
}
.cr-garage-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* Records + achievements. */
.cr-rec-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:8px;width:100%;max-width:520px;
}
.cr-rec{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:8px 10px;display:flex;flex-direction:column;gap:2px;
}
.cr-rec .k{font-family:var(--mono);font-size:8.5px;color:var(--ink-faint);
  text-transform:uppercase;letter-spacing:.1em}
.cr-rec .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.cr-ach-list{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:6px;width:100%;max-width:560px;max-height:180px;overflow-y:auto;
  padding-right:4px;
}
.cr-ach{
  display:flex;gap:8px;align-items:center;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:7px 10px;opacity:.5;
}
.cr-ach.got{
  opacity:1;border-color:rgba(94,242,192,.35);
}
.cr-ach .ico{font-size:17px}
.cr-ach .tx{display:flex;flex-direction:column;line-height:1.3}
.cr-ach .tx b{font-size:11.5px}
.cr-ach .tx i{font-style:normal;font-family:var(--mono);font-size:9px;
  color:var(--ink-dim)}

/* Championship. */
.cr-champ-body{max-width:480px;width:100%;text-align:left}
.cr-champ-evs{list-style:none;display:flex;flex-direction:column;gap:6px;margin:10px 0}
.cr-champ-evs li{
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;font-size:12px;display:flex;justify-content:space-between;
  gap:8px;flex-wrap:wrap;align-items:center;
}
.cr-champ-evs li.done{opacity:.75}
.cr-champ-evs li.next{border-color:rgba(94,242,192,.45)}
.cr-champ-evs .res{font-family:var(--mono);font-size:10px;color:var(--acc)}
.cr-champ-pts{font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
.cr-champ-note{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint)}
.cr-champ-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px}
.cr-champ-table th{
  font-family:var(--mono);font-size:8.5px;color:var(--ink-faint);
  text-transform:uppercase;letter-spacing:.1em;text-align:left;padding:4px 8px;
}
.cr-champ-table td{padding:4px 8px;border-top:1px solid var(--line)}
h4{margin:14px 0 4px;font-size:12px;letter-spacing:.04em}

/* Results progression line. */
.cr-ov-progress{display:flex;flex-direction:column;gap:4px;max-width:420px}
.cr-prog{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;
  padding:5px 10px;border-radius:8px;background:var(--panel2);
  border:1px solid var(--line);
}
.cr-prog.rec{color:var(--acc);border-color:rgba(94,242,192,.35)}
.cr-prog.ach{color:#ffc857;border-color:rgba(255,200,87,.3)}
.cr-prog.unlk{color:var(--violet);border-color:rgba(180,140,255,.35)}
.cr-prog.champ{color:#ff5ca8;border-color:rgba(255,92,168,.35)}

@media (prefers-reduced-motion:reduce){
  .cr-car-card:hover{transform:none}
}

@media (prefers-reduced-motion:reduce){
  .cr-meter-fill{transition:none}
  .cr-card-lane{animation:none}
  .cr-card-car{filter:none}
}

/* Internal evaluation workspaces ---------------------------
 * ONE unified workspace (#eval) with its own compact left sidebar and a
 * single main pane. Sections reuse the console's tokens so they read as
 * native views. No card landing page, no iframes. */
.evws{
  display:flex;flex:1;min-height:0;align-items:stretch;
}
.evws-side{
  width:196px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;
  padding:14px 10px;border-right:1px solid var(--line);
  background:var(--bg2);
}
.evws-item{
  display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:9px;
  border:1px solid transparent;background:none;cursor:pointer;text-align:left;
  color:var(--ink-dim);font-family:var(--sans);font-weight:500;font-size:12.5px;
  white-space:nowrap;transition:all .15s;
}
.evws-item svg{width:15px;height:15px;flex-shrink:0}
.evws-item:hover{color:var(--ink);background:var(--panel)}
.evws-item.on{
  color:var(--acc);background:var(--acc-glow);border-color:rgba(94,242,192,.22);
}
.evws-sep{height:1px;background:var(--line);margin:8px 6px}
.evws-foot{
  margin-top:auto;padding:10px 11px;font-family:var(--mono);font-size:9.5px;
  color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.evws-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto}
/* Section content keeps the standard .content rhythm inside the pane. */
.evws-main .content{padding:20px 22px 50px}
/* Full-bleed section (Model Evaluation): an embedded original webpage
   must use every pixel of the pane — no card, padding or extra scrollbar.
   The iframe document is the only thing that scrolls. */
.evws-main .evws-full{flex:1;min-height:0;display:flex}
.evws-full-frame{
  flex:1;width:100%;height:100%;border:0;display:block;
}
@media (max-width:900px){
  /* Phones: sidebar collapses to a horizontal scroll strip above content. */
  .evws{flex-direction:column}
  .evws-side{
    width:100%;flex-direction:row;overflow-x:auto;border-right:none;
    border-bottom:1px solid var(--line);padding:10px 12px;
  }
  .evws-sep{display:none}
  .evws-item span{font-size:12px}
  .evws-foot{display:none}
}
.ev-portal-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin:26px 0 14px;flex-wrap:wrap;
}
.ev-portal-t{
  font-family:var(--mono);font-size:11px;color:var(--acc);letter-spacing:.08em;
  text-transform:uppercase;
}
.ev-portal-s{color:var(--ink-dim);font-size:12.5px;margin-top:4px}
.ev-select{
  background:var(--bg);border:1px solid var(--line2);color:var(--ink);
  border-radius:10px;padding:6px 11px;font-family:var(--mono);font-size:11.5px;
  outline:none;cursor:pointer;transition:border-color .15s;
}
.ev-select:hover{border-color:var(--acc-dim)}
.ev-select:focus-visible{border-color:var(--acc)}
.ev-facets{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.ev-facet{display:flex;gap:12px;align-items:flex-start}
.ev-facet-k{
  font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);text-transform:uppercase;
  letter-spacing:.1em;min-width:74px;padding-top:5px;flex-shrink:0;
}
.ev-facet-v{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.ev-chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--panel);
  border:1px solid var(--line2);color:var(--ink-dim);border-radius:20px;
  padding:3px 10px;font-family:var(--mono);font-size:10.5px;cursor:pointer;
  transition:all .13s;white-space:nowrap;
}
.ev-chip span{color:var(--ink-faint);font-size:9.5px}
.ev-chip:hover{color:var(--ink);border-color:var(--acc-dim)}
.ev-chip.on{
  color:var(--acc);border-color:rgba(94,242,192,.32);background:rgba(94,242,192,.07);
}
.ev-chip.on span{color:var(--acc-dim)}
.ev-chip.static{cursor:default}
.ev-chip-row{display:flex;flex-wrap:wrap;gap:6px}
.ev-pre{
  margin:0;padding:16px 18px;overflow:auto;max-height:60vh;
  font-family:var(--mono);font-size:11.5px;line-height:1.7;color:var(--ink-dim);
  white-space:pre-wrap;word-break:break-word;
}
.ev-two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:1000px){.ev-two-col{grid-template-columns:1fr}}
.ev-doc-link{
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:11px 14px;cursor:pointer;text-align:left;transition:all .14s;
}
.ev-doc-link:hover{border-color:var(--acc-dim);background:var(--panel)}
.ev-doc-link-t{font-size:13px;font-weight:600;color:var(--ink)}
.ev-doc-link-s{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
.ev-run-body{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.ev-sub-h{
  font-family:var(--mono);font-size:10px;color:var(--ink-faint);text-transform:uppercase;
  letter-spacing:.1em;margin-bottom:8px;
}
.ev-big-acc{
  font-size:26px;font-weight:800;color:var(--acc);letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.ev-stat{
  font-family:var(--mono);font-size:11px;color:var(--ink-dim);
  background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:6px 11px;
}
.ev-stat b{color:var(--ink);font-weight:700}
.ev-sum-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:12px 15px;
}
.ev-sum-t{font-size:13.5px;font-weight:600}
.ev-sum-s{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:2px}
.ev-sum-acc{
  font-size:21px;font-weight:800;color:var(--acc);letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;flex-shrink:0;
}
.ev-md{
  padding:18px 22px;max-width:900px;font-size:13.5px;line-height:1.75;color:var(--ink-dim);
}
.ev-md h1,.ev-md h2,.ev-md h3{color:var(--ink);letter-spacing:-.01em;margin:22px 0 10px}
.ev-md h1{font-size:21px}.ev-md h2{font-size:17px}.ev-md h3{font-size:14.5px}
.ev-md h1:first-child{margin-top:0}
.ev-md p{margin:10px 0}

/* Report cards (Internal Evaluation → Reports) ---------------- */
/* Grid of one card per report artifact, mirroring .ws-card density. */
.ev-rep-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  gap:14px;align-items:stretch;
}
.ev-rep-card{
  display:flex;flex-direction:column;gap:0;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:15px 16px;
  transition:border-color .14s,transform .14s;
}
.ev-rep-card:hover{border-color:var(--acc-dim)}
.ev-rep-head{display:flex;align-items:flex-start;gap:10px}
.ev-rep-acc{
  font-size:24px;font-weight:800;color:var(--acc);letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;flex-shrink:0;line-height:1.1;min-width:64px;
  text-align:right;
}
.ev-rep-acc.na{color:var(--ink-faint);font-size:15px;font-weight:600}
.ev-rep-title{font-size:13.5px;font-weight:650;color:var(--ink);line-height:1.35}
.ev-rep-sub{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:3px;overflow-wrap:anywhere}
.ev-rep-meta{
  display:flex;flex-wrap:wrap;gap:5px;margin-top:11px;
}
.ev-rep-meta .ev-chip{cursor:default;padding:2px 9px;font-size:9.5px}
.ev-rep-acts{
  display:flex;flex-wrap:wrap;gap:7px;margin-top:auto;padding-top:13px;
}
.ev-rep-btn{
  display:inline-flex;align-items:center;gap:6px;border-radius:8px;
  border:1px solid var(--line2);background:var(--panel2);color:var(--ink-dim);
  font-family:var(--sans);font-size:11.5px;font-weight:550;padding:6px 11px;
  cursor:pointer;transition:all .13s;white-space:nowrap;
}
.ev-rep-btn:hover{color:var(--ink);border-color:var(--acc-dim);background:var(--panel)}
.ev-rep-btn.primary{
  color:#06251c;background:var(--acc);border-color:var(--acc);font-weight:650;
}
.ev-rep-btn.primary:hover{filter:brightness(1.07);color:#06251c}
.ev-rep-btn:disabled{opacity:.4;cursor:not-allowed}
@media (max-width:700px){.ev-rep-grid{grid-template-columns:minmax(0,1fr)}}
.ev-md ul,.ev-md ol{margin:10px 0 10px 22px}
.ev-md li{margin:4px 0}
.ev-md code{
  font-family:var(--mono);font-size:11.5px;background:var(--panel2);
  border:1px solid var(--line);border-radius:5px;padding:1.5px 5px;color:var(--ink);
}
.ev-md pre{
  background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:13px 15px;overflow-x:auto;margin:12px 0;
}
.ev-md pre code{background:none;border:none;padding:0}
.ev-md table{width:auto;min-width:420px;margin:12px 0;border:1px solid var(--line);border-radius:10px}
.ev-md th,.ev-md td{padding:8px 12px;font-size:12px}
.ev-md a{color:var(--acc)}
.ev-md blockquote{
  border-left:3px solid var(--acc-dim);margin:12px 0;padding:4px 0 4px 14px;color:var(--ink-faint);
}

/* Launcher grid: 3 columns on wide desktops (balanced rows), 2 on tablet,
 * one on phones. Internal Evaluation is ONE card like every workspace. */
@media (min-width:1151px){
  body.ws-launcher .ws-grid{grid-template-columns:repeat(3,1fr)}
}

.ws-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);
  padding:clamp(20px,2.2vw,30px);display:flex;flex-direction:column;gap:14px;position:relative;
  overflow:hidden;--ws:var(--acc);min-height:0;
  /* The card itself is the link (workspace-selection screen). */
  text-decoration:none;color:inherit;
  transition:border-color .15s, transform .15s, box-shadow .15s;
}
body.ws-launcher .ws-card{justify-content:space-between;gap:clamp(10px,2.2vh,22px)}
/* Large cards: the title band centers in the space above the anchored
 * Open action, so the card's middle reads as breathing room, not a dead
 * zone squeezed between two fixed gaps. */
body.ws-launcher .ws-head{flex:1;align-items:center}
.ws-card:hover{
  border-color:color-mix(in srgb,var(--ws) 50%,transparent);
  transform:translateY(-2px);
  box-shadow:0 10px 30px -12px rgba(94,242,192,.18);
}
.ws-card:focus-visible{outline:2px solid var(--ws);outline-offset:2px}
.ws-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ws);opacity:.75}
.ws-head{display:flex;align-items:flex-start;gap:14px}
.ws-ico{
  width:clamp(38px,3vw,46px);height:clamp(38px,3vw,46px);flex-shrink:0;border-radius:11px;display:grid;place-items:center;
  color:var(--ws);background:color-mix(in srgb,var(--ws) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--ws) 26%,transparent);
}
.ws-ico svg{width:20px;height:20px}
.ws-title{flex:1;min-width:0}
.ws-name{font-size:clamp(15.5px,1.35vw,19px);font-weight:700;letter-spacing:-.01em}
.ws-blurb{font-size:clamp(12px,1vw,13.5px);color:var(--ink-dim);margin-top:6px;line-height:1.55}
/* Launcher mode: badge sits under the title row instead of squeezing it. */
body.ws-launcher .ws-badge{margin-left:auto}
/* Collapse to one column when the viewport is too narrow for two usable
 * cards side by side; keep every card visible without scroll where the
 * height allows (cards shrink with the grid, never clip). */
@media (max-width:900px){
  body.ws-launcher .ws-grid{grid-template-columns:1fr;grid-auto-rows:minmax(170px,auto)}
  body.ws-launcher .content-inner{padding:20px 20px 16px}
  body.ws-launcher .portal-sub{display:none}
}
.ws-badge{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--ink-faint);
  white-space:nowrap;flex-shrink:0;
}
.ws-badge.ok{color:var(--acc);border-color:rgba(94,242,192,.32);background:rgba(94,242,192,.07)}
.ws-badge.idle{color:var(--blue);border-color:rgba(111,183,255,.3);background:rgba(111,183,255,.06)}
.ws-badge.warn{color:var(--amber);border-color:rgba(255,200,87,.3);background:rgba(255,200,87,.06)}
.ws-badge.err{color:var(--red);border-color:rgba(255,107,129,.32);background:rgba(255,107,129,.07)}
.ws-badge.na{color:var(--ink-faint)}
.ws-badge.sk{animation:pulse 1.6s infinite}

.ws-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;flex:1}
.ws-metric{min-width:0}
.ws-mk{font-family:var(--mono);font-size:9px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.11em}
.ws-mv{font-size:16.5px;font-weight:700;letter-spacing:-.01em;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-ms{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-mv .dim{color:var(--ink-faint);font-weight:500;font-size:12.5px}
.ws-mv .na{color:var(--ink-faint);font-weight:500;font-size:12.5px}
.ws-error{
  grid-column:1/-1;font-family:var(--mono);font-size:11px;color:var(--red);
  background:rgba(255,107,129,.06);border:1px solid rgba(255,107,129,.22);
  border-radius:9px;padding:10px 12px;word-break:break-word;
}
.ws-note{
  grid-column:1/-1;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);
  line-height:1.6;word-break:break-word;
}
.ws-foot{display:flex;justify-content:flex-end}
.ws-open{
  font-family:var(--mono);font-size:11px;color:var(--ws);
  padding:7px 12px;border-radius:9px;border:1px solid color-mix(in srgb,var(--ws) 30%,transparent);
  display:inline-block;
}
.ws-card:hover .ws-open{background:color-mix(in srgb,var(--ws) 10%,transparent)}

.sk-line{
  height:11px;border-radius:6px;background:linear-gradient(90deg,var(--panel2) 25%,var(--line) 50%,var(--panel2) 75%);
  background-size:200% 100%;animation:shimmer 1.4s infinite;
}
.sk-line.short{width:55%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Activity: one column per real source. No synthetic unified feed. */
.act-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;padding:16px 18px}
.act-col{min-width:0}
.act-src{
  font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);text-transform:uppercase;
  letter-spacing:.11em;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--line);
}
.act-table{width:100%;border-collapse:collapse}
.act-table td{padding:5px 6px 5px 0;font-size:11.5px;vertical-align:middle;max-width:0}
.act-k{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-m{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-s{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);white-space:nowrap}
.act-t{font-family:var(--mono);font-size:10px;color:var(--ink-faint);white-space:nowrap;text-align:right}
.empty-note{
  padding:26px 18px;font-family:var(--mono);font-size:11px;color:var(--ink-faint);
  text-align:center;line-height:1.7;
}
@media (max-width:720px){
  .ws-metrics{grid-template-columns:1fr}
  .act-grid{grid-template-columns:1fr}
}

/* ---------- navigation groups (Loop shell) ---------- */
.nav-group{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--ink-faint);
  text-transform:uppercase;padding:12px 12px 4px;user-select:none;white-space:nowrap;
}
.nav .nav-group:first-child{padding-top:2px}
a.nav-item{text-decoration:none;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--ink-dim);font-weight:500;font-size:13.5px;white-space:nowrap;border:1px solid transparent;transition:all .16s}
a.nav-item:hover{color:var(--ink);background:var(--panel)}
a.nav-item:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- pipeline workspaces ---------- */
.stage-chip{
  display:inline-block;font-family:var(--mono);font-size:9.5px;padding:2px 7px;
  border-radius:6px;background:var(--panel2);border:1px solid var(--line2);
  color:var(--ink-dim);margin:1px 2px 1px 0;white-space:nowrap;
}
.lang-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.lang-k{font-family:var(--mono);font-size:11px;color:var(--ink-dim);width:76px;flex-shrink:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang-bar{flex:1;height:7px;border-radius:5px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.lang-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc-dim),var(--acc));border-radius:5px}
.lang-v{font-family:var(--mono);font-size:10px;color:var(--ink-faint);width:110px;text-align:right;flex-shrink:0}
.stage-flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.stage-card{
  background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:14px 15px;
  display:flex;flex-direction:column;gap:11px;min-width:0;
}
.stage-head{display:flex;gap:11px;align-items:flex-start}
.stage-num{
  font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--amber);
  border:1px solid rgba(255,200,87,.3);background:rgba(255,200,87,.07);
  border-radius:7px;padding:3px 7px;flex-shrink:0;
}
.stage-name{font-size:13.5px;font-weight:600}
.stage-id{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);margin-top:2px}
.stage-bars{display:flex;flex-direction:column;gap:6px}
.stage-bar-row{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
.stage-bar-row span{width:38px;flex-shrink:0}
.stage-bar-row b{color:var(--ink-dim);width:44px;text-align:right;flex-shrink:0}
.stage-stats{display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:10.5px;color:var(--ink-dim)}
.stage-reasons{border-top:1px dashed var(--line);padding-top:9px}
.reason-row{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:10px;margin-top:4px}
.reason-k{color:var(--red);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reason-v{color:var(--ink-faint);white-space:nowrap}
.stage-path{
  font-family:var(--mono);font-size:9px;color:var(--ink-faint);word-break:break-all;
  border-top:1px solid var(--line);padding-top:8px;margin-top:auto;
}
.dim{color:var(--ink-faint)}

/* ---------- embedded mode ----------
 * When mounted inside the unified dashboard's iframe, hide the guest's own
 * sidebar and topbar — the shell supplies navigation and page titles. The
 * content fills the frame; the toast stays (useful feedback for copies,
 * deletes and saves made from inside the frame).
 */
html.embedded .sidebar{display:none}
html.embedded .topbar{display:none}
html.embedded .app{height:100%}
html.embedded .chat-layout{height:calc(100vh - 0px)}
/* Guest's own hash routing still works in the frame; its nav is hidden but
 * the router remains driven by the shell repointing location.hash. */

@media (max-width:900px){
  .conv-list{display:none}
  .chat-scroll,.composer-wrap{padding-left:14px;padding-right:14px}
  .wf-label{width:120px}
  .wf-track{left:130px}
  .wf-axis{margin-left:130px}
  .sidebar{width:58px}
  .nav-item span,.brand-txt,.side-foot{display:none}
}

/* ============================================================
   DIAGRAM SHELL STYLES (shared by #pretrain/architecture and
   #sft/workflow). The pretraining architecture view embeds the
   prebuilt pipeline_architecture.html in an iframe; the SFT workflow
   view uses the pan/zoom engine directly. Both share this toolbar.
   ============================================================ */

/* Entry card on the stage view */
.pa-entry{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  background:linear-gradient(135deg,var(--panel),var(--panel2));
  border:1px solid var(--line2);border-radius:var(--rad);
  padding:16px 20px;margin-bottom:18px;
}
.pa-entry-t{font-weight:600;font-size:14.5px}
.pa-entry-s{color:var(--ink-dim);font-size:12.5px;margin-top:3px;max-width:640px}
.pa-entry-btn{
  display:inline-flex;align-items:center;gap:8px;flex-shrink:0;
  color:var(--acc);text-decoration:none;font-weight:600;font-size:13px;
  border:1px solid rgba(94,242,192,.3);background:rgba(94,242,192,.07);
  padding:9px 15px;border-radius:10px;transition:all .16s;white-space:nowrap;
}
.pa-entry-btn:hover{background:rgba(94,242,192,.14);border-color:rgba(94,242,192,.5)}
.pa-entry-btn svg{width:15px;height:15px}

/* Layout */
.pa-wrap{max-width:none;padding-bottom:26px}
.pa-toolbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:12px;flex-wrap:wrap;
}
.pa-toolbar-l,.pa-toolbar-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pa-sep{width:1px;height:20px;background:var(--line2);margin:0 4px}
.pa-btn{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  background:var(--panel2);border:1px solid var(--line2);color:var(--ink-dim);
  font-family:var(--sans);font-size:12.5px;font-weight:500;
  padding:7px 13px;border-radius:9px;transition:all .15s;
}
.pa-btn:hover{color:var(--ink);border-color:var(--acc-dim);background:var(--panel)}
.pa-btn:disabled{opacity:.4;cursor:not-allowed}
.pa-btn svg{width:14px;height:14px}
.pa-zoom-btn{min-width:34px;justify-content:center;font-size:15px;line-height:1;padding:6px 0}
.pa-zoom-pct{
  font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);
  min-width:44px;text-align:center;
}

.pa-stage-row{display:flex;gap:14px;align-items:stretch}
.pa-viewport{
  position:relative;flex:1;min-width:0;height:calc(100vh - 250px);min-height:520px;
  background:
    radial-gradient(900px 420px at 70% -10%, rgba(94,242,192,.045), transparent 60%),
    radial-gradient(700px 380px at 0% 110%, rgba(180,140,255,.04), transparent 60%),
    var(--bg2);
  border:1px solid var(--line);border-radius:var(--rad);
  overflow:hidden;cursor:grab;touch-action:none;
}
.pa-viewport:active{cursor:grabbing}
.pa-world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.pa-hint{
  position:absolute;left:14px;bottom:12px;pointer-events:none;
  font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);
  background:rgba(7,9,13,.72);padding:5px 10px;border-radius:7px;
  border:1px solid var(--line);
}

/* Details panel */
.pa-detail{
  width:330px;flex-shrink:0;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);
  overflow:hidden;
}
.pa-detail-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:16px 18px 13px;border-bottom:1px solid var(--line);
}
.pa-detail-group{
  font-family:var(--mono);font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px;
}
.pa-detail-title{font-weight:600;font-size:15px;line-height:1.35}
.pa-badge{
  flex-shrink:0;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;
  padding:4px 9px;border-radius:20px;white-space:nowrap;margin-top:2px;
}
.pa-badge-built{color:var(--acc);background:rgba(94,242,192,.1);border:1px solid rgba(94,242,192,.3)}
.pa-badge-planned{color:var(--amber);background:rgba(255,200,87,.09);border:1px solid rgba(255,200,87,.3)}
.pa-detail-body{padding:14px 18px 18px;overflow-y:auto;flex:1}
.pa-detail-empty{color:var(--ink-dim);font-size:12.5px;line-height:1.75;padding-top:6px}
.pa-detail-row{margin-bottom:14px}
.pa-detail-row:last-child{margin-bottom:0}
.pa-detail-k{
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--acc-dim);margin-bottom:5px;
}
.pa-detail-v{color:var(--ink-dim);font-size:12.5px;line-height:1.68}

/* Legend */
.pa-legend{
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  margin-top:12px;padding:0 4px;
  font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);
}
.pa-lg{display:inline-flex;align-items:center;gap:7px}
.pa-lg-dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.pa-lg-built{background:rgba(94,242,192,.16);border:1px solid rgba(94,242,192,.55)}
.pa-lg-planned{background:rgba(255,200,87,.1);border:1px dashed rgba(255,200,87,.55)}
.pa-lg-arrow{
  width:20px;height:0;border-top:2px solid var(--line2);
  display:inline-block;position:relative;
}
.pa-lg-arrow::after{
  content:'';position:absolute;right:-1px;top:-4px;
  border-left:6px solid var(--line2);border-top:3px solid transparent;
  border-bottom:3px solid transparent;
}
.pa-note{margin-left:auto;letter-spacing:0;font-family:var(--sans)}

/* ---- SVG world ---- */
.pa-group-box{fill:rgba(255,255,255,.014);stroke-width:1.4}
.pa-hue-blue   { stroke:rgba(111,183,255,.30) }
.pa-hue-cyan   { stroke:rgba(94,242,192,.28) }
.pa-hue-amber  { stroke:rgba(255,200,87,.28) }
.pa-hue-violet { stroke:rgba(180,140,255,.30) }
.pa-hue-green  { stroke:rgba(94,242,192,.30) }
.pa-hue-pink   { stroke:rgba(255,107,129,.28) }
.pa-group-title{
  fill:var(--ink);font-family:var(--sans);font-size:21px;font-weight:600;
  letter-spacing:-.01em;
}
.pa-group-sub{
  fill:var(--ink-faint);font-family:var(--mono);font-size:12px;letter-spacing:.04em;
}

.pa-node{cursor:pointer;outline:none}
.pa-node-box{
  fill:var(--panel);stroke:var(--line2);stroke-width:1.3;
  transition:stroke .15s, filter .15s;
}
.pa-node:hover .pa-node-box,
.pa-node:focus-visible .pa-node-box{stroke:var(--acc);filter:drop-shadow(0 0 10px rgba(94,242,192,.22))}
.pa-node-sel .pa-node-box{stroke:var(--acc);stroke-width:1.8;
  filter:drop-shadow(0 0 12px rgba(94,242,192,.3))}
.pa-node-planned .pa-node-box{stroke-dasharray:5 4}
.pa-node-box-out{fill:rgba(94,242,192,.05)}
.pa-node-inner{pointer-events:none}
.pa-node-title{
  color:var(--ink);font-family:var(--sans);font-size:15.5px;font-weight:600;
  line-height:1.32;letter-spacing:-.01em;
}
.pa-node-sub{
  color:var(--ink-dim);font-family:var(--mono);font-size:11.5px;
  line-height:1.5;margin-top:5px;
}
.pa-node-out .pa-node-title{color:var(--acc)}

.pa-edge{
  fill:none;stroke:var(--line2);stroke-width:1.7;
  marker-end:url(#paArrow);transition:stroke .15s, stroke-width .15s;
}
.pa-edge-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:none}
.pa-edge-on{stroke:var(--acc);stroke-width:2.4;
  filter:drop-shadow(0 0 5px rgba(94,242,192,.35))}
.pa-arrow{fill:var(--line2)}
.pa-edge-on + .pa-edge-hit ~ .pa-arrow,
.edge-on .pa-arrow{fill:var(--acc)}

.pa-removal-box{
  fill:rgba(255,107,129,.035);stroke:rgba(255,107,129,.28);
  stroke-width:1.3;stroke-dasharray:7 5;
}
.pa-removal{cursor:pointer;outline:none}
.pa-removal:hover .pa-removal-box,
.pa-removal:focus-visible .pa-removal-box{stroke:var(--red)}
.pa-removal-title{
  color:var(--red);font-family:var(--mono);font-size:14px;font-weight:500;
}
.pa-removal-sub{color:var(--ink-dim);font-size:12px;line-height:1.6;margin-top:6px}

/* Fullscreen mode */
body.pa-fs .pa-wrap{height:100vh;display:flex;flex-direction:column;padding:0;max-width:none}
body.pa-fs .content{height:100vh;overflow:hidden}
body.pa-fs .content-inner{height:100%;display:flex;flex-direction:column;padding:14px 18px}
body.pa-fs .pa-stage-row{flex:1;min-height:0}
body.pa-fs .pa-viewport{height:auto;flex:1}
body.pa-fs .pa-detail{width:360px}

@media (max-width:1080px){
  .pa-stage-row{flex-direction:column}
  .pa-detail{width:100%;max-height:300px}
  .pa-viewport{height:56vh;min-height:380px}
}
@media (max-width:720px){
  .pa-entry{flex-direction:column;align-items:flex-start}
  .pa-note{margin-left:0}
  .pa-viewport{height:48vh;min-height:320px}
}

/* ---- additions shared by both pipeline canvases ---- */

/* DEMO DATA flag in the toolbar */
.pa-demo-flag{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--amber);
  border:1px solid rgba(255,200,87,.35);background:rgba(255,200,87,.08);
  padding:5px 10px;border-radius:20px;white-space:nowrap;
}

/* Side lanes (selftest harness / planned work) */
.pa-lane{cursor:pointer;outline:none}
.pa-lane-box{
  fill:rgba(94,242,192,.035);stroke:rgba(94,242,192,.26);
  stroke-width:1.3;stroke-dasharray:7 5;
}
.pa-lane-planned{
  fill:rgba(255,200,87,.035);stroke:rgba(255,200,87,.28);
}
.pa-lane:hover .pa-lane-box,
.pa-lane:focus-visible .pa-lane-box{stroke:var(--acc)}
.pa-lane-planned:hover .pa-lane-box,
.pa-lane-planned:focus-visible .pa-lane-box{stroke:var(--amber)}
.pa-lane-title{
  color:var(--acc);font-family:var(--mono);font-size:14px;font-weight:500;
}
.pa-lane-planned .pa-lane-title{color:var(--amber)}
.pa-lane-sub{color:var(--ink-dim);font-size:12px;line-height:1.6;margin-top:6px}

/* Optional-layer node style (judge) */
.pa-node-optional .pa-node-box{stroke-dasharray:3 4}

/* Iframe mount for the embedded architecture component */
.pa-frame-box{
  position:relative;border:1px solid var(--line);border-radius:var(--rad);
  overflow:hidden;background:var(--bg2);
  height:calc(100vh - 235px);min-height:540px;
}
.pa-frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}
.pa-open-standalone{
  display:inline-flex;align-items:center;color:var(--ink-dim);text-decoration:none;
  font-size:12.5px;font-weight:500;padding:7px 11px;border-radius:9px;
  border:1px solid var(--line2);background:var(--panel2);transition:all .15s;
}
.pa-open-standalone:hover{color:var(--ink);border-color:var(--acc-dim)}
.pa-note-line{
  margin-top:10px;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);
}
.pa-note-line code{color:var(--ink-dim)}

/* ---------- SFT code explorer (#sft/code) ---------- */
.sx-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.sx-layout{grid-template-columns:1fr}}
.sx-side{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);
  overflow:hidden;position:sticky;top:0;
}
.sx-side-h{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-faint);padding:12px 14px 8px;
}
.sx-files{max-height:calc(100vh - 220px);overflow-y:auto;padding:0 8px 10px}
.sx-file{
  display:block;width:100%;text-align:left;cursor:pointer;background:transparent;border:1px solid transparent;
  border-radius:9px;padding:8px 10px;margin-bottom:2px;transition:all .14s;
}
.sx-file:hover{background:var(--panel2);border-color:var(--line2)}
.sx-file-on{background:rgba(94,242,192,.08)!important;border-color:rgba(94,242,192,.35)!important}
.sx-file-n{display:block;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink)}
.sx-file-l{display:block;font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);margin-top:2px}
.sx-main{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;
  display:flex;flex-direction:column;min-width:0;
}
.sx-head{
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.sx-file-name{font-size:14px;font-weight:600}
.sx-file-path{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:2px;word-break:break-all}
.sx-file-meta{font-family:var(--mono);font-size:10px;color:var(--ink-dim);white-space:nowrap}
.sx-syms{
  display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px;border-bottom:1px solid var(--line);
}
.sx-sym{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:var(--panel2);
  border:1px solid var(--line2);border-radius:7px;padding:3px 8px;transition:all .14s;
}
.sx-sym:hover{border-color:var(--acc-dim);color:var(--ink)}
.sx-sym-k{font-family:var(--mono);font-size:9px;color:var(--violet);text-transform:uppercase;letter-spacing:.06em}
.sx-sym-class .sx-sym-k{color:var(--blue)}
.sx-sym-n{font-family:var(--mono);font-size:11px;color:var(--ink)}
.sx-sym-l{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint)}
.sx-doc{
  margin:10px 14px 0;padding:10px 12px;border:1px dashed var(--line2);border-radius:9px;
  font-size:12px;color:var(--ink-dim);line-height:1.65;white-space:pre-wrap;
}
.sx-src{
  margin:10px 14px 14px;padding:14px 16px;background:var(--bg2);border:1px solid var(--line);
  border-radius:10px;overflow:auto;max-height:calc(100vh - 330px);min-height:300px;
  font-family:var(--mono);font-size:11.5px;line-height:1.62;color:var(--ink-dim);
  tab-size:4;
}
.sx-src code{white-space:pre}
.sx-kw{color:var(--violet)}
.sx-str{color:var(--acc)}
.sx-com{color:var(--ink-faint);font-style:italic}
.sx-num{color:var(--amber)}
.sx-flag-group{margin-bottom:12px}
.sx-flag-group:last-child{margin-bottom:0}
.sx-flag-sev{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:6px;
}

/* Fullscreen keeps the frame filling the screen */
body.pa-fs .pa-frame-box{height:auto;flex:1;min-height:0}
@media (max-width:1080px){.pa-frame-box{height:60vh;min-height:420px}}
@media (max-width:720px){.pa-frame-box{height:52vh;min-height:360px}}

        <button class="sw-signout sw-support-btn" id="supportBtn" type="button" hidden
