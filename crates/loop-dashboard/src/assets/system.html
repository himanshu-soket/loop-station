/*
 * Embedded console host. The /console SPA is mounted in an iframe pointing
 * at the same origin with a hash route; its own router renders the view.
 * The frame is created ONCE and reused across loop routes — only the guest's
 * hash changes, so streaming chat, composer focus and scroll survive shell
 * navigation. System polling continues; charts are pruned on entry/exit.
 */
function viewLoopHost(route) {
  const target = LOOP_ROUTES[route] || 'chat';
  return '<div class="loop-host" id="loopHost">' +
    '<iframe class="embed-frame" id="loopFrame" title="Loop console" ' +
      'src="/console#' + encodeURIComponent(target) + '"></iframe>' +
    '</div>';
}

function mountLoopRoute(route) {
  // Reuse the existing frame when one is already mounted: navigating the
  // guest's hash keeps its state (conversation, filters, scroll).
  let frame = $('loopFrame');
  const target = '#' + encodeURIComponent(LOOP_ROUTES[route] || 'chat');
  if (!frame) return;   // frame absent → structural render creates it
  try {
    if (frame.contentWindow && frame.contentWindow.location.hash !== target) {
      frame.contentWindow.location.hash = target;
    }
  } catch (e) { /* cross-origin shouldn't happen (same origin); ignore */ }
}

/* ================================================================
   Incremental rendering.

   The old render() replaced .content-inner's innerHTML on every sample,
   destroying and remounting every chart each tick — hovers died mid-gesture,
   text selection broke, and the visible flash read like a page reload.

   Now:
     * renderView()  rebuilds structure only when the VIEW changes.
     * updateLive()  runs each tick and patches only the values that
                     changed (KPI numbers, bars, sub-labels) plus chart
                     geometry — no DOM replacement.
   Values are tagged data-live="<key>" by the view builders; updateLive
   recomputes them from S.* through the same builder functions.
   ================================================================ */

/* True when two formatted values differ (cheap string compare). */
function textChanged(el, next) {
  return el.__lastText !== next;
}
function setText(el, next) {
  if (el.__lastText === next) return;
  el.__lastText = next;
  el.textContent = next;
}

/** Patch all [data-live] nodes in `root` using `values` (key → html/text). */
function patchLive(root, values) {
  const nodes = root.querySelectorAll('[data-live]');
  nodes.forEach(function (n) {
    const key = n.dataset.live;
    const next = values[key];
    if (next === undefined) return;           // not provided this pass
    if (textChanged(n, next)) {
      n.textContent = next;
      n.__lastText = next;
    }
  });
  // Progress bars animate via width only.
  root.querySelectorAll('[data-bar]').forEach(function (b) {
    const key = b.dataset.bar;
    const pct = values['bar:' + key];
    if (pct == null || !isFinite(pct)) return;
    const w = Math.min(100, Math.max(0, pct)) + '%';
    if (b.__lastW !== w) { b.style.width = w; b.__lastW = w; }
  });
}

/* Series data for a mounted chart, by its stable name. Centralises the
 * mapping so updateLive() can refresh charts without view cooperation. */
const CHART_SERIES_KEYS = {
  ovCpu:   'cpu',  cpuHist: 'cpu',
  ovMem:   'mem',  memHist: 'mem',
  ovNet:   'net',  netHist: 'net',
  ovDisk:  'disk', diskHist: 'disk',
  gpuHist: 'gpu',  battHist: 'batt',
};
/*
 * Series for a mounted chart, clipped to its current viewport window.
 *
 * The backend keeps the full bounded buffer; this reads only the slice the
 * user can see, so a 1-minute view over an hour of history costs ~30 points
 * per series instead of ~1800 on every tick.
 */
function histSeriesFor(chartName) {
  const key = CHART_SERIES_KEYS[chartName];
  if (!key) return null;
  const st = CHARTS.get(chartName);

  // Resolve the window from real data bounds (cheap: first/last of arrays).
  let since = null;
  if (st) {
    const probe = S.history && S.history[key === 'cpu' ? 'cpuPercent'
        : key === 'mem' ? 'memoryUsedBytes'
        : key === 'net' ? 'netRecvPerSec'
        : key === 'disk' ? 'diskReadPerSec'
        : key === 'gpu' ? 'gpuUtilPercent'
        : 'batteryChargePercent'];
    if (Array.isArray(probe) && probe.length) {
      const dataT1 = probe[probe.length - 1].t;
      const span = Math.max(1, dataT1 - probe[0].t);
      const w = st.rangeMs != null ? Math.min(st.rangeMs, span) : span;
      const end = st.live ? dataT1 : (st.anchor != null ? st.anchor : dataT1);
      since = end - w;
    }
  }

  // Build only the requested family, with the clip applied.
  const P = k => histPoints(k, since);
  switch (key) {
    case 'cpu': return [
      {name:'total',  color:'#4ecdc4', points: P('cpuPercent')},
      {name:'user',   color:'#64a8ff', points: P('cpuUserPercent')},
      {name:'system', color:'#f5b841', points: P('cpuSystemPercent')}];
    case 'mem': return [
      {name:'used',      color:'#a78bfa', points: P('memoryUsedBytes')},
      {name:'swap used', color:'#ff6b7d', points: P('swapUsedBytes')}];
    case 'net': return [
      {name:'download', color:'#64a8ff', points: P('netRecvPerSec')},
      {name:'upload',   color:'#4ecdc4', points: P('netSentPerSec')}];
    case 'disk': return [
      {name:'read/s',  color:'#4ecdc4', points: P('diskReadPerSec')},
      {name:'write/s', color:'#f5b841', points: P('diskWritePerSec')}];
    case 'gpu': return [
      {name:'utilization', color:'#f5b841', points: P('gpuUtilPercent')}];
    case 'batt': return [
      {name:'charge', color:'#4ecdc4', points: P('batteryChargePercent')}];
  }
  return null;
}

/*
 * Per-view live value patchers. Each returns/writes the same strings the
 * structural builder produced, but into existing nodes.
 */
const LIVE_UPDATERS = {
  overview: function (inner) {
    const o = S.overview; if (!o) return;
    const snap = S.snapshot;
    const values = {
      ovCpu: fmtPct(o.cpuPercent),
      'ovCpu:sub': 'user ' + fmtPct(o.cpuUserPercent, 0) + ' · sys ' + fmtPct(o.cpuSystemPercent, 0),
      'bar:ovCpu': o.cpuPercent,
      ovMem: fmtBytes(o.memoryUsedBytes, 1),
      'ovMem:sub': 'of ' + fmtBytes(o.memoryTotalBytes, 0) + ' · swap ' +
        (o.swapUsedBytes != null ? fmtBytes(o.swapUsedBytes, 1) : 'n/a'),
      'bar:ovMem': o.memoryTotalBytes ? 100 * o.memoryUsedBytes / o.memoryTotalBytes : 0,
      ovDisk: 'R ' + (o.diskReadPerSec != null ? fmtRate(o.diskReadPerSec) : '…') +
              ' \u00B7 W ' + (o.diskWritePerSec != null ? fmtRate(o.diskWritePerSec) : '…'),
      'ovDisk:sub': (o.diskReadPerSec == null && o.diskWritePerSec == null)
        ? 'first sample seeds counters' : 'across all volumes',
      ovNet: '\u2193 ' + fmtRate(o.netRecvPerSec) + ' \u00B7 \u2191 ' + fmtRate(o.netSentPerSec),
      'ovNet:sub': 'physical interfaces, loopback excluded',
    };
    if (snap && snap.gpu) {
      const g = snap.gpu;
      const gu = mval(g.utilizationPercent);
      values.ovGpu = gu != null ? fmtPct(gu) : 'Unavailable';
      values['bar:ovGpu'] = gu != null ? gu : null;
    }
    if (snap && snap.battery) {
      const b = snap.battery;
      const bp = mval(b.chargePercent);
      if (bp != null) {
        values.ovBatt = fmtPct(bp, 0);
        values['bar:ovBatt'] = bp;
      }
    }
    if (snap && snap.uptimeSecs != null) values.ovUp = fmtUptime(snap.uptimeSecs) || '';
    if (snap && snap.cpu && snap.cpu.loadAverage) {
      const la = snap.cpu.loadAverage;
      values.ovLoad = la.one.toFixed(2);
      values['ovLoad:sub'] = '5m ' + la.five.toFixed(2) + ' \u00B7 15m ' + la.fifteen.toFixed(2);
    }
    if (o.processCount != null) {
      values.ovProc = String(o.processCount);
      values['ovProc:sub'] = 'sample #' + o.sampleCount;
    }

    // AI System Overview: re-run the deterministic analysis so verdict,
    // rows and recommendations track the newest sample in place.
    if (inner.querySelector('#aiOverview')) {
      // Keys must match the data-live attributes rendered by
      // aiOverviewCard(): ai:cpu | ai:memory | ai:gpu | ai:battery.
      const reads = {
        cpu: aiReadCpu(o),
        memory: aiReadMemory(o),
        gpu: aiReadGpu(S.snapshot),
        battery: aiReadBattery(S.snapshot),
      };
      const v = aiVerdict(Object.values(reads), stalenessMs(), S.error);
      values['ai:verdict'] = v.label;
      for (const k of Object.keys(reads)) {
        if (reads[k]) values['ai:' + k] = reads[k].text;
      }
      if (o.sampledAtMs) {
        values['ai:stamp'] = 'updated ' + ago(o.sampledAtMs) + ' · sample #' + o.sampleCount;
      }
    }
    patchLive(inner, values);
  },
};

function renderNav() {
  const nav = $('nav');
  const wanted = 'ws|' + VIEWS.map(v => v[0]).join(',');
  if (nav.dataset.builtFor !== wanted) {
    const item = (list) => list.map(v =>
      '<div class="nav-item' + ((S.view === v[0] || (v[0] === 'overview' && !LOOP_ROUTES[S.view])) ? ' active' : '') + '" data-view="' + v[0] + '" ' +
      'title="' + esc(v[1]) + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
      'stroke-linecap="round" stroke-linejoin="round"><path d="' + v[2] + '"/></svg>' +
      '<span>' + esc(v[1]) + '</span></div>').join('');
    // Primary workspaces — the same five destinations every shell offers.
    // Real anchors for the other shells (browser history + focus), this
    // workspace's own group rendered as items. "Loop AI Console" points at
    // the console SPA's chat view, the workspace's front door.
    const extItem = (href, label, path) =>
      '<a class="nav-item" href="' + href + '" title="' + esc(label) + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
      'stroke-linecap="round" stroke-linejoin="round"><path d="' + path + '"/></svg>' +
      '<span>' + esc(label) + '</span></a>';
    const ICON_PATHS = {
      welcome: 'M3 13a9 9 0 1 0 9-9M3 13V4M13 3v10h8',
      loop:    'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z',
      sft:     'M12 3v18M5 8l7-5 7 5M5 16l7 5 7-5',
      pretrain:'M4 6c0 1.7 3.6 3 8 3s8-1.3 8-3-3.6-3-8-3-8 1.3-8 3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6',
    };
    nav.innerHTML =
      '<div class="nav-group">Workspaces</div>' +
      extItem('/console#overview', 'Welcome', ICON_PATHS.welcome) +
      item([['overview','System Overview','M0 3h18v6H3zM3 11h8v10H3zM13 11h8v10h-8z']]) +
      extItem('/console#chat', 'Loop AI Console', ICON_PATHS.loop) +
      extItem('/console#sft', 'SFT DataTrove', ICON_PATHS.sft) +
      extItem('/console#pretrain', 'Pretraining DataTrove', ICON_PATHS.pretrain) +
      /* This workspace's own sections: the metric views. The workspace's
       * front door ("System Overview") is the primary item above, so the
       * hardware/system views start here without repeating it. */
      '<div class="nav-group">System Dashboard</div>' + item(VIEWS.slice(1));
    nav.dataset.builtFor = wanted;
    nav.querySelectorAll('.nav-item[data-view]').forEach(el => {
      el.addEventListener('click', () => {
        if (S.view === el.dataset.view) return;
        S.view = el.dataset.view;
        // Keep the URL shareable: each view gets a history entry, and the
        // hashchange handler above renders on back/forward.
        if (decodeURIComponent(location.hash.replace('#','')) !== S.view)
          location.hash = S.view;
        // Leaving a view: drop its chart state (observers, tooltips) so
        // nothing keeps firing against detached nodes.
        pruneCharts();
        if (S.view === 'processes') refreshProcesses(); else render();
      });
    });
  } else {
    nav.querySelectorAll('.nav-item[data-view]').forEach(el => {
      el.classList.toggle('active', el.dataset.view === S.view);
    });
  }
}

/* Which view the currently-mounted skeleton belongs to. */
let mountedView = null;

/**
 * Rebuild the view structure. Called on navigation and on first paint —
 * NOT on every sample (updateLive handles ticks).
 */
function render() {
  renderNav();

  const isLoop = !!LOOP_ROUTES[S.view];
  const t = (isLoop ? LOOP_TITLES : VIEW_TITLES)[S.view] || VIEW_TITLES.overview;
  $('pageTitle').textContent = t[0];
  $('pageSub').textContent = t[1] + (isLoop ? '' : (S.demo ? ' · DEMO DATA' : ''));
  updateStatusLine();
  $('retryBtn').style.display = S.error ? 'inline-block' : 'none';

  // Loop console routes: mount/repoint the embedded SPA and stop — the guest
  // owns its content region; system banners/footer do not apply to it.
  if (isLoop) {
    const inner = $('content').querySelector('.content-inner');
    const frame = $('loopFrame');
    if (frame && inner.contains(frame)) {
      // Same host, different route: keep the frame alive, just navigate.
      mountLoopRoute(S.view);
      mountedView = S.view;
      return;
    }
    // No frame yet (or a system view was mounted): replace the column with
    // the loop host. The iframe boots fresh with the target hash.
    pruneCharts();
    inner.innerHTML = viewLoopHost(S.view);
    mountedView = S.view;
    return;
  }

  const renderer = VIEW_RENDERERS[S.view] || viewOverview;
  let html = '';
  // Machine identity + honest aggregate status lead every system view.
  if (!isLoop) html += healthStripHtml();
  if (S.error) {
    html += '<div class="banner error">failed to fetch metrics: ' + esc(S.error) +
      ' — retrying automatically, or press “retry now”</div>';
    // Data older than the staleness threshold must never look current:
    // keep the last good values but label them explicitly.
    if (stalenessMs() != null && S.overview && S.overview.sampledAtMs) {
      html += '<div class="banner stale">stale data — last successful sample was ' +
        ago(S.overview.sampledAtMs) + '; values below are from then, not live</div>';
    }
  } else if (stalenessMs() != null && S.overview && S.overview.sampledAtMs) {
    html += '<div class="banner stale">data stale — newest sample is ' +
      ago(S.overview.sampledAtMs) + ' old; values below may not be current</div>';
  }
  if (S.demo) {
    html += '<div class="banner demo">DEMO MODE — synthetic metrics for offline UI testing, ' +
      'not real measurements from this Mac.</div>';
  }

  let body;
  try {
    body = renderer();
  } catch (e) {
    body = '<div class="banner error">render error: ' + esc(e.message) + '</div>';
  }
  html += body;

  const samples = S.history
    ? Math.max(histPoints('cpuPercent').length, histPoints('memoryUsedBytes').length)
    : 0;
  html += '<footer class="note">Metrics are collected locally by sampling this Mac — ' +
    'nothing leaves localhost. CPU percentages derive from Mach per-core tick deltas; ' +
    'memory follows macOS Activity Monitor semantics; GPU utilization from IOKit; ' +
    'battery from AppleSmartBattery. History covers this monitor\'s runtime (' + samples +
    ' samples), kept in memory only. Unavailable metrics are shown with their reason — ' +
    'values are never fabricated.</footer>';

  // Replace only the content region; sidebar/topbar keep their DOM nodes.
  const inner = $('content').querySelector('.content-inner');
  inner.innerHTML = html;
  mountedView = S.view;

  // Mount interactive charts declared by this view. Each view embeds exactly
  // one registry; query all and merge so per-card registries also work.
  const registries = inner.querySelectorAll('script[type="application/json"].chart-registry');
  if (registries.length) {
    let merged = {};
    let parseError = null;
    registries.forEach(function (r) {
      try {
        Object.assign(merged, JSON.parse(r.textContent));
      } catch (e) {
        parseError = e;
      }
    });
    if (parseError) {
      const grid = inner.querySelector('.grid') || inner;
      grid.insertAdjacentHTML('afterbegin',
        '<div class="banner error">chart setup failed: ' + esc(parseError.message) + '</div>');
    } else {
      Object.keys(merged).forEach(function (k) { resolveFormatters(merged[k]); });
      try {
        mountChartsIn(inner, merged);
      } catch (e) {
        const grid = inner.querySelector('.grid') || inner;
        grid.insertAdjacentHTML('afterbegin',
          '<div class="banner error">chart setup failed: ' + esc(e.message) + '</div>');
      }
    }
    // Drop observers/tooltips for charts that left the DOM with the old view.
    pruneCharts();
  }
  wireViewHandlers();
}

/*
 * Topbar freshness line. Only "updated Xs ago" — the sampling interval is
 * already visible in the picker, so repeating it here was redundant copy.
 */
function updateStatusLine() {
  const note = S.lastFetch ? ('updated ' + ago(S.lastFetch)) : 'connecting…';
  if ($('refreshNote').textContent !== note) $('refreshNote').textContent = note;
}

/**
 * Per-tick update: patch live values in place. Never rebuilds structure, so
 * hovers, drags, focus and text selection all survive incoming samples.
 * Falls back to a full render only when the mounted view changed underneath
 * us (e.g. first paint after an error path).
 */
function updateLive() {
  if (mountedView !== S.view) { render(); return; }

  // Embedded console owns its region; nothing for the live patcher to do.
  if (LOOP_ROUTES[S.view]) return;

  updateStatusLine();
  $('retryBtn').style.display = S.error ? 'inline-block' : 'none';

  const inner = $('content').querySelector('.content-inner');

  // Error/demo/stale banners appear or disappear only on state transitions.
  const hasErrBanner = !!inner.querySelector('.banner.error');
  if (!!S.error !== hasErrBanner) { render(); return; }
  const hasStaleBanner = !!inner.querySelector('.banner.stale');
  if ((stalenessMs() != null) !== hasStaleBanner) { render(); return; }

  // Health strip: patch label/detail/dot in place (no structural rebuild).
  const strip = inner.querySelector('#healthStrip');
  if (strip) {
    const h = healthState();
    const dot = strip.querySelector('.health-dot');
    const title = strip.querySelector('.health-title');
    const detail = strip.querySelector('.health-detail');
    if (dot && title && detail) {
      dot.className = 'health-dot ' + h.cls;
      if (title.textContent !== h.label) title.textContent = h.label;
      if (detail.textContent !== h.detail) detail.textContent = h.detail;
    }
  }

  // Live value patches per view — same builders the views use, but writing
  // into data-live nodes instead of creating new markup.
  try {
    LIVE_UPDATERS[S.view] && LIVE_UPDATERS[S.view](inner);
  } catch (e) {
    // A failing updater must not silently blank the dashboard; fall back to
    // a structural render which has its own error banner.
    render();
    return;
  }

  // Charts: update geometry in place (no remount).
  document.querySelectorAll('[data-chart]').forEach(function (el) {
    const st = CHARTS.get(el.dataset.chart);
    if (!st || !st.lastCfg) return;
    // Refresh the series data on the existing config, then redraw.
    st.lastCfg.series = histSeriesFor(el.dataset.chart);
    mountChart(el, st.lastCfg);
  });
}

function wireViewHandlers() {
  const search = $('procSearch');
  if (search && !search.dataset.wired) {
    search.dataset.wired = '1';
    let deb;
    search.addEventListener('input', () => {
      clearTimeout(deb);
      deb = setTimeout(() => { S.procQuery = search.value; refreshProcesses(); }, 250);
    });
  }
  document.querySelectorAll('th[data-k]').forEach(thEl => {
    if (thEl.dataset.wired) return;
    thEl.dataset.wired = '1';
    thEl.addEventListener('click', () => {
      const k = thEl.dataset.k;
      if (S.procSort === k) S.procDir = S.procDir === 'desc' ? 'asc' : 'desc';
      else { S.procSort = k; S.procDir = 'desc'; }
      refreshProcesses();
    });
  });
}

/* ================================================================
   Interval control
   ================================================================ */
$('intervalSel').addEventListener('change', async e => {
  const ms = Number(e.target.value);
  try {
    const r = await fetch('/api/sys/interval', {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify({ms}),
    });
    if (!r.ok) throw new Error(await r.text());
    await refresh();
  } catch (err) {
    S.error = 'interval change failed: ' + (err.message || err);
    render();
  }
});

$('retryBtn').addEventListener('click', () => refresh());

/* ================================================================
   Boot
   ================================================================ */
/* Hash routing: keeps the URL in sync with the sidebar and makes browser
 * back/forward work for /system views. Deep links (/system#cpu, …) already
 * read the hash at init; this covers subsequent navigation. */
window.addEventListener('hashchange', () => {
  const h = decodeURIComponent(location.hash.replace('#','')) || 'overview';
  if (h === S.view) return;
  if (VIEWS.some(v => v[0] === h) || LOOP_ROUTES[h]) {
    S.view = h;
    pruneCharts();
    if (S.view === 'processes') refreshProcesses(); else render();
  }
});

(async function boot() {
  try {
    await refresh();
  } catch (e) {
    S.error = e.message || String(e);
    render();
  }
  // Fallback poller in case refresh() above didn't schedule one (error path).
  if (S.timerId == null) scheduleTimers();
  // Process view refreshes a bit more often than metrics when active.
  S.procTimerId = setInterval(() => {
    if (S.view === 'processes' && document.visibilityState === 'visible') {
      refreshProcesses();
    }
  }, 3000);
  // Keep "updated Xs ago" fresh between polls.
  setInterval(() => {
    if (S.lastFetch) updateStatusLine();
  }, 1000);

  // Shared shell: session chip + sign-out (no-op when auth is off).
  initSessionChip();

  /*
   * Hidden tab: stop polling and stop rendering. The backend keeps sampling
   * with real timestamps, so when the tab returns the charts show genuine
   * history including the gap — no synthetic samples are invented for it.
   */
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      refresh();                       // catch up immediately
      scheduleTimers(true);
    } else if (S.timerId != null) {
      clearInterval(S.timerId);
      S.timerId = null;
      currentIntervalMs = 0;
    }
  });

  // Self-audit mode (?audit=1): measures the rendered layout and reports
  // overflow as JSON in a <pre id="AUDIT_RESULT">. Used by headless
  // verification; harmless (and inert) in normal use.
  if (new URLSearchParams(location.search).get('audit') === '1') {
    runSelfAudit();
  }
})();

/* ================================================================
   Layout self-audit (?audit=1)
   Verifies charts/cards stay inside their containers at the current
   viewport. Runs after data-driven rendering settles.
   ================================================================ */
function auditLayoutOnce() {
  const problems = [];
  const info = {charts: 0, cards: 0, docScrollW: 0, docClientW: 0, view: S.view};
  const de = document.documentElement;
  info.docScrollW = de.scrollWidth;
  info.docClientW = de.clientWidth;
  if (de.scrollWidth > de.clientWidth + 1) {
    problems.push('document horizontal overflow: scrollWidth ' + de.scrollWidth +
                  ' > clientWidth ' + de.clientWidth);
  }

  const cardTitle = c => { const h = c.querySelector('h3'); return h ? h.textContent : '(untitled)'; };

  document.querySelectorAll('.card').forEach(card => {
    const cr = card.getBoundingClientRect();
    Array.prototype.forEach.call(card.children, child => {
      const r = child.getBoundingClientRect();
      if (r.width === 0 || r.height === 0) return;
      // Overflow = child extends past the card's box on any side.
      const outRight = r.right - cr.right;      // >0 → past right edge
      const outLeft = cr.left - r.left;         // >0 → past LEFT edge (child starts before card)
      const outBottom = r.bottom - cr.bottom;   // >0 → below card
      if (outRight > 1.5 || outLeft > 1.5) {
        problems.push('card "' + cardTitle(card) + '" child .' + child.className +
                      ' overflows horizontally by ' + Math.max(outRight, outLeft).toFixed(1) + 'px');
      }
      if (outBottom > 1.5) {
        problems.push('card "' + cardTitle(card) + '" child .' + child.className +
                      ' overflows bottom by ' + outBottom.toFixed(1) + 'px');
      }
    });
  });

  document.querySelectorAll('svg').forEach((svg, i) => {
    const card = svg.closest('.card');
    if (!card) return;
    info.charts++;
    const sr = svg.getBoundingClientRect();
    const cr = card.getBoundingClientRect();
    if (sr.width === 0) return;
    if (sr.right > cr.right + 1.5) problems.push('svg[' + i + '] exceeds card right by ' + (sr.right - cr.right).toFixed(1) + 'px');
    if (sr.left < cr.left - 1.5) problems.push('svg[' + i + '] exceeds card left by ' + (cr.left - sr.left).toFixed(1) + 'px');
    if (sr.right > de.clientWidth + 1) problems.push('svg[' + i + '] extends past viewport by ' + (sr.right - de.clientWidth).toFixed(1) + 'px');
    // Labels must stay within the svg's own box.
    Array.prototype.forEach.call(svg.querySelectorAll('text'), t => {
      const tr = t.getBoundingClientRect();
      if (tr.left < sr.left - 1 || tr.right > sr.right + 1) {
        problems.push('svg[' + i + '] text "' + t.textContent.slice(0, 20) + '" escapes chart bounds');
      }
    });
  });

  const kpis = document.querySelector('.kpis');
  if (kpis) {
    const kr = kpis.getBoundingClientRect();
    Array.prototype.forEach.call(kpis.children, k => {
      const r = k.getBoundingClientRect();
      if (r.right > kr.right + 1.5) problems.push('kpi exceeds grid by ' + (r.right - kr.right).toFixed(1) + 'px');
    });
  }
  document.querySelectorAll('.chart-legend:not(.chart-controls)').forEach((lg, i) => {
    const card = lg.closest('.card');
    if (!card) return;
    const cr = card.getBoundingClientRect(), lr = lg.getBoundingClientRect();
    if (lr.right > cr.right + 1.5) problems.push('legend[' + i + '] overflows card by ' + (lr.right - cr.right).toFixed(1) + 'px');
  });

  /*
   * Toolbar vs. heading overlap — the regression this audit guards against.
   * The toolbar must sit strictly BELOW the subtitle (and therefore below
   * the title) and must never intersect the plot box or the legend.
   */
  document.querySelectorAll('.chart-controls').forEach((ctl, i) => {
    const card = ctl.closest('.card');
    if (!card) return;
    const tr = ctl.getBoundingClientRect();
    const h3 = card.querySelector('h3'), hint = card.querySelector('.hint');
    [['title', h3], ['subtitle', hint]].forEach(([nm, el]) => {
      if (!el) return;
      const r = el.getBoundingClientRect();
      const ix = Math.max(0, Math.min(tr.right, r.right) - Math.max(tr.left, r.left));
      const iy = Math.max(0, Math.min(tr.bottom, r.bottom) - Math.max(tr.top, r.top));
      if (ix > 1 && iy > 1) {
        problems.push('toolbar[' + i + '] overlaps ' + nm + ' by ' +
                      Math.round(ix) + 'x' + Math.round(iy) + 'px on "' +
                      (h3 ? h3.textContent.trim() : '?') + '"');
      }
    });
    const box = card.querySelector('.chart-box');
    if (box) {
      const br = box.getBoundingClientRect();
      const ix = Math.max(0, Math.min(tr.right, br.right) - Math.max(tr.left, br.left));
      const iy = Math.max(0, Math.min(tr.bottom, br.bottom) - Math.max(tr.top, br.top));
      if (ix > 1 && iy > 1) {
        problems.push('toolbar[' + i + '] overlaps the chart plot by ' +
                      Math.round(ix) + 'x' + Math.round(iy) + 'px');
      }
    }
    // Every control must stay inside its own card.
    if (tr.right > card.getBoundingClientRect().right + 1.5) {
      problems.push('toolbar[' + i + '] escapes its card');
    }
  });
  return {problems, info};
}

function runSelfAudit() {
  // Wait for the first data-driven render, then measure each view in turn.
  // Loop console routes are skipped: their content lives in a cross-document
  // iframe this audit cannot reach, and the guest audits itself.
  const views = VIEWS.map(v => v[0]);
  let vi = 0;
  const results = [];
  const step = () => {
    if (vi >= views.length) {
      const pre = document.createElement('pre');
      pre.id = 'AUDIT_RESULT';
      pre.textContent = 'AUDIT_JSON_START' + JSON.stringify(results) + 'AUDIT_JSON_END';
      document.body.appendChild(pre);
      return;
    }
    S.view = views[vi];
    render();
    // Let charts mount and ResizeObservers fire.
    setTimeout(() => {
      try { results.push(auditLayoutOnce()); }
      catch (e) { results.push({problems: ['audit error: ' + e.message], info: {}}); }
      vi++;
      step();
    }, 350);
  };
  setTimeout(step, 1200);
}
