<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop · System Dashboard</title>
<style>
:root{
  --bg:#0a0c10; --bg2:#0d1017; --panel:#131722; --panel2:#181d2b;
  --line:#212839; --line2:#2c3550;
  /* ink-faint is raised from #5c6779 (~3.0:1) for readable secondary text
     on the dark panels; still clearly subordinate to --ink-dim. */
  --ink:#e9edf5; --ink-dim:#a3aec2; --ink-faint:#78849b;
  --acc:#4ecdc4; --acc-dim:#2f8f89;
  --amber:#f5b841; --red:#ff6b7d; --blue:#64a8ff; --violet:#a78bfa;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --rad:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:13.5px;line-height:1.5;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(78,205,196,.28)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
.app{display:flex;height:100vh}
.sidebar{
  width:200px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;
}
.brand{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.brand-mark{
  width:30px;height:30px;flex-shrink:0;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(135deg,#12332e,#17423a);border:1px solid #1f5a50;
  color:var(--acc);font-family:var(--mono);font-weight:700;font-size:13px;
}
.brand-name{font-weight:700;font-size:12.5px;letter-spacing:-.01em}
.brand-sub{font-family:var(--mono);font-size:8.5px;color:var(--ink-faint);letter-spacing:.09em;text-transform:uppercase}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:8px;cursor:pointer;
  color:var(--ink-dim);font-weight:500;font-size:12.5px;border:1px solid transparent;
  transition:background .12s,color .12s;user-select:none;
}
.nav-item:hover{color:var(--ink);background:var(--panel)}
.nav-item.active{color:var(--acc);background:rgba(78,205,196,.09);border-color:rgba(78,205,196,.18)}
.nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:.85}
/* Portal anchor in the sidebar: same metrics as .nav-item but a real link. */
a.nav-item{text-decoration:none;display:flex;align-items:center;gap:9px;padding:7px 11px;
  border-radius:8px;cursor:pointer;color:var(--ink-dim);font-weight:500;font-size:12.5px;
  border:1px solid transparent;transition:background .12s,color .12s;user-select:none}
a.nav-item:hover{color:var(--ink);background:var(--panel)}
a.nav-item:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.side-foot{padding:11px 16px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-right:6px;animation:pulse 2.4s infinite}
.live-dot.err{background:var(--red);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:12px;padding:11px 20px;
  border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap;
}
.page-title{font-size:14.5px;font-weight:650;letter-spacing:-.01em}
.page-sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:1px}
.topbar-spacer{flex:1}
.interval-ctrl{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;color:var(--ink-dim)}
.interval-ctrl select{
  background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:7px;
  padding:4px 8px;font-family:var(--mono);font-size:11px;outline:none;cursor:pointer;
}
.interval-ctrl select:focus{border-color:var(--acc-dim)}
.retry-btn{
  background:var(--panel);border:1px solid var(--line2);color:var(--ink-dim);border-radius:7px;
  padding:4px 11px;font-family:var(--mono);font-size:11px;cursor:pointer;display:none;
}
.retry-btn:hover{color:var(--ink);border-color:var(--acc-dim)}
.refresh-note{font-family:var(--mono);font-size:10px;color:var(--ink-faint)}

/*
 * Content column. Views stack their sections with a single gap rule instead
 * of per-card inline margins. max-width keeps line lengths readable on very
 * wide windows rather than stretching cards across 2000px.
 */
.content{flex:1;overflow-y:auto;padding:18px 20px 40px}
/*
 * The inner column fills the scroll container's height so flex children can
 * distribute leftover vertical space (chart cards marked .fill). When content
 * is taller than the viewport it simply grows and scrolls as before.
 */
.content-inner{
  max-width:1560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  min-height:calc(100% - 54px);
}
/* The loading/error placeholders shouldn't stretch to full column height. */
.content-inner > .loading-msg,
.content-inner > .empty-msg{flex:0 0 auto}

/* ---------- banners ---------- */
.banner{border-radius:10px;padding:9px 14px;margin-bottom:16px;font-size:12.5px;display:flex;gap:10px;align-items:center}
.banner.error{background:rgba(255,107,125,.08);border:1px solid rgba(255,107,125,.3);color:var(--red)}
.banner.demo{background:rgba(245,184,65,.07);border:1px solid rgba(245,184,65,.3);color:var(--amber)}
.banner.stale{background:rgba(245,184,65,.07);border:1px solid rgba(245,184,65,.32);color:var(--amber)}

/* System health strip: honest aggregate of freshness + errors. */
.health-strip{display:flex;align-items:center;gap:10px;border-radius:10px;
  padding:10px 14px;margin-bottom:16px;border:1px solid var(--line);
  background:var(--panel);font-size:12.5px;flex-wrap:wrap}
.health-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--acc)}
.health-dot.warn{background:var(--amber)}
.health-dot.err{background:var(--red)}
.health-title{font-weight:700}
.health-detail{color:var(--ink-dim)}
.health-spacer{flex:1}

/* ---------- AI System Overview card ---------- */
.ai-card{margin-bottom:16px;padding:15px 17px}
.ai-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.ai-head h3{margin-bottom:2px}
.ai-verdict{
  display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;
  padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);
  white-space:nowrap;
}
.ai-verdict.ok{color:var(--acc);border-color:rgba(94,242,192,.32);background:rgba(94,242,192,.07)}
.ai-verdict.warn{color:var(--amber);border-color:rgba(245,184,65,.32);background:rgba(245,184,65,.07)}
.ai-verdict.crit{color:var(--red);border-color:rgba(255,107,125,.32);background:rgba(255,107,125,.07)}
.ai-verdict.unknown{color:var(--ink-dim)}
.ai-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:var(--acc)}
.ai-dot.warn{background:var(--amber)}
.ai-dot.crit{background:var(--red)}
.ai-dot.na{background:var(--ink-faint);opacity:.5}
.ai-rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:7px 22px;margin:13px 0 4px}
.ai-row{display:flex;align-items:baseline;gap:9px;font-size:12.5px;min-width:0}
.ai-row-name{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink-faint);
  width:72px;flex:none;text-transform:uppercase;
}
.ai-row-text{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-recs{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.ai-rec{font-size:12px;color:var(--ink-dim);padding-left:2px}
.ai-rec.warn{color:var(--amber)}
.ai-rec.crit{color:var(--red)}
.ai-rec.ok{color:var(--ink-dim)}
.ai-foot{
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:11px;
  border-top:1px dashed var(--line);padding-top:9px;
}
.ai-stamp{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint)}
.ai-thresholds{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint)}

/* ---------- KPI cards ---------- */
/*
 * KPI grid. Overview shows 9 cards; auto-fit produced ragged rows like
 * 7 + 2 on mid-width windows. Fixed track counts per breakpoint keep the
 * grid balanced (9 → 5 + 4 at wide, 3×3 narrower), and every card in a row
 * shares one height so the row reads evenly.
 */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}
.kpis > .kpi{min-width:0;display:flex;flex-direction:column}
.kpi-value,.kpi-sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:1450px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media (max-width:1150px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.kpis{grid-template-columns:1fr}}
.kpi{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);
  padding:12px 14px 11px;position:relative;overflow:hidden;
}
.kpi-label{
  font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);text-transform:uppercase;
  letter-spacing:.1em;margin-bottom:5px;display:flex;justify-content:space-between;gap:6px;cursor:help;
}
.kpi-value{font-size:23px;font-weight:650;letter-spacing:-.02em;font-family:var(--mono);line-height:1.15}
.kpi-sub{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);margin-top:3px}
.kpi.unavail .kpi-value{color:var(--ink-faint);font-size:15px;font-weight:500}
.bar{height:4px;border-radius:3px;background:var(--bg);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .45s ease}
/* Compact trend line for cards without a utilization bar, so every card in
   the row carries an equivalent visual element. */
.spark{height:14px;margin-top:6px;display:block}
.spark path{fill:none;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}

/* ---------- cards & charts ---------- */
/*
 * Chart grid: 2 x 2 on desktop (CPU+Memory, then Network+Disk) so the
 * reclaimed width goes into taller, more readable charts; single column
 * below ~1000px where two columns would be cramped.
 */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.grid{grid-template-columns:1fr}}
/* Direct card children of a view use the column gap (no inline margins). */
.content-inner > .card{margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:14px 16px;min-width:0}
.card h3{font-size:12.5px;font-weight:650;margin-bottom:2px;display:flex;align-items:center;gap:7px}
.card .hint{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-bottom:10px}

/*
 * Chart frame.
 *
 * The card is a grid item; grid items default to min-width:auto which lets
 * wide content (long labels, unbreakable values) blow out the track and push
 * the whole dashboard sideways. min-width:0 on .card plus this wrapper's
 * width:100%/max-width:100% keeps the chart inside its card at every size,
 * and the SVG below is laid out in CSS pixels (no viewBox stretching), so
 * labels never scale away or clip.
 */
/*
 * A chart card marked .fill grows to absorb leftover vertical space in its
 * view (flex column), and the chart box inside stretches with it. The SVG
 * reads its box's real height at mount time, so no hardcoded chart heights.
 */
.card.fill{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
/* In the overview grid the row itself stretches; each card fills its cell. */
.grid-fill{flex:1 1 auto;align-items:stretch;grid-auto-rows:1fr;min-height:0}
.grid-fill .card.fill{flex:1 1 auto;height:100%}
.card.fill .chart{flex:1;display:flex;flex-direction:column;min-height:120px}
.card.fill .chart .chart-box{flex:1}
.chart{width:100%;max-width:100%;position:relative;min-height:1px}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
/* Only the plot area (lines/areas) is clipped; axes labels sit outside it. */
.chart .plot{overflow:hidden}
.chart-legend{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;align-items:center}
.chart-legend .lg-item{
  font-family:var(--mono);font-size:10px;color:var(--ink-dim);
  display:inline-flex;align-items:center;gap:5px;cursor:pointer;
  border:1px solid transparent;border-radius:6px;padding:2px 6px;user-select:none;
}
.chart-legend .lg-item:hover{color:var(--ink);background:var(--panel2)}
.chart-legend .lg-item.off{opacity:.4;text-decoration:line-through}
.chart-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;flex-shrink:0}
.chart-empty{font-family:var(--mono);font-size:11px;color:var(--ink-faint);padding:34px 0;text-align:center}

/* Hover crosshair + tooltip (absolutely positioned inside .chart). */
.chart-tip{
  position:absolute;pointer-events:none;z-index:5;display:none;
  background:rgba(13,16,23,.96);border:1px solid var(--line2);border-radius:8px;
  padding:7px 10px;font-family:var(--mono);font-size:10.5px;line-height:1.65;
  box-shadow:0 6px 18px rgba(0,0,0,.45);white-space:nowrap;
}
.chart-tip .t{color:var(--ink-faint);margin-bottom:3px}
.chart-tip .r{display:flex;align-items:center;gap:6px}
.chart-tip .r i{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.chart-tip .r b{font-weight:600;margin-left:auto;padding-left:10px}

/*
 * Chart toolbar — the time-range / step / live controls.
 *
 * This used to be `className = 'chart-legend chart-controls'` with NO rule
 * for `.chart-controls` anywhere, so the toolbar was laid out entirely by
 * `.chart-legend` and sat wherever it happened to land in document order.
 * On cards whose legend wrapped onto several rows the toolbar could end up
 * level with (or over) the card's heading area.
 *
 * It is now a real footer under the chart, in normal flow, so it can never
 * overlap the title, subtitle, plot or legend regardless of how many series
 * a card has. It keeps `.chart-legend` only for the shared focus-ring rule
 * further down; all layout comes from here.
 */
.chart-controls{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  margin-top:10px;min-height:24px;
}
/* Keep the two halves together when the row does wrap. */
.chart-controls .range-nav{margin-right:2px}
/* Touch targets: 9.5px type is fine for a pointer, too small for a thumb. */
@media (pointer:coarse){
  .step-btn,.live-badge,.range-ctrl button{min-height:26px;min-width:30px}
}

/* Time-range selector shown in chart headers that have enough history. */
.range-ctrl{display:inline-flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px}
.range-ctrl button{
  font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);background:none;border:0;
  border-radius:5px;padding:2px 7px;cursor:pointer;
}
.range-ctrl button:hover{color:var(--ink-dim)}
.range-ctrl button.on{background:var(--panel2);color:var(--acc)}

/* Step buttons flanking the range control. */
.range-nav{display:inline-flex;gap:2px}
.step-btn{
  font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);background:var(--bg);
  border:1px solid var(--line);border-radius:6px;padding:2px 7px;cursor:pointer;line-height:1.4;
}
.step-btn:hover{color:var(--ink);border-color:var(--line2)}
.step-btn:active{transform:translateY(1px)}

/* Live badge / back-to-live. */
.live-badge{
  font-family:var(--mono);font-size:9.5px;border-radius:99px;padding:2px 9px;cursor:pointer;
  background:var(--bg);border:1px solid var(--line);color:var(--ink-dim);
}
.live-badge.on{
  color:var(--acc);border-color:rgba(78,205,196,.35);background:rgba(78,205,196,.07);
  cursor:default;
}
.live-badge:not(.on){border-color:rgba(245,184,65,.4);color:var(--amber)}
.live-badge:not(.on):hover{background:rgba(245,184,65,.1)}

/* Historical-mode note ("viewing HH:MM:SS–HH:MM:SS"). */
.hist-note{font-family:var(--mono);font-size:9.5px;color:var(--amber);opacity:.85}

/* Chart plot is pannable: show a grab cursor only over the plot area. */
.chart-box{cursor:crosshair}
.chart-box:active{cursor:grabbing}

/* Visible keyboard focus for every chart control (a11y). */
.range-ctrl button:focus-visible,.step-btn:focus-visible,.live-badge:focus-visible,
.lg-item:focus-visible,.chart-box:focus-visible{
  outline:2px solid var(--acc-dim);outline-offset:1px;
}

/* ---------- per-core grid ---------- */
.core-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.core{border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:6px 5px;text-align:center}
.core-id{font-family:var(--mono);font-size:8.5px;color:var(--ink-faint)}
.core-pct{font-family:var(--mono);font-size:12.5px;font-weight:600;margin-top:1px}

/* ---------- volumes / interfaces ---------- */
.row-list{display:flex;flex-direction:column}
.list-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(33,40,57,.5)}
.list-row:last-child{border-bottom:none}
.vol-name{font-weight:600;font-size:12.5px}
.vol-mount{font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
.vol-bar{flex:1;height:6px;border-radius:4px;background:var(--bg);overflow:hidden;min-width:70px}
.vol-bar i{display:block;height:100%;border-radius:4px;transition:width .45s ease}
.vol-size{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);text-align:right;min-width:140px}
.iface-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(33,40,57,.5);font-family:var(--mono);font-size:11.5px;align-items:center}
.iface-row:last-child{border-bottom:none}

/* ---------- process table ---------- */
.proc-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.proc-search{
  background:var(--bg);border:1px solid var(--line2);color:var(--ink);border-radius:8px;
  padding:7px 12px;font-family:var(--mono);font-size:11.5px;outline:none;width:250px;max-width:100%;
}
.proc-search:focus{border-color:var(--acc-dim)}
.proc-count{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{
  font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink-faint);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);
  cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;background:var(--panel);
}
th:hover{color:var(--ink-dim)}
th.sorted{color:var(--acc)}
td{padding:6px 10px;border-bottom:1px solid rgba(33,40,57,.45);font-family:var(--mono);font-size:11.5px;white-space:nowrap}
tbody tr:hover td{background:rgba(24,29,43,.55)}
.readonly-note{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:10px}

/* ---------- states ---------- */
.muted{color:var(--ink-faint)}
.dim{color:var(--ink-dim)}
.acc{color:var(--acc)}
.amber{color:var(--amber)}
.red{color:var(--red)}
.blue{color:var(--blue)}
.violet{color:var(--violet)}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--ink-dim)}
.chip.ok{border-color:rgba(78,205,196,.3);color:var(--acc)}
.chip.na{border-color:var(--line2);color:var(--ink-faint)}
.empty-msg{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);padding:26px;text-align:center}
.loading-msg{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);padding:40px;text-align:center}
.skeleton{background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

footer.note{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:22px;line-height:1.7;border-top:1px solid var(--line);padding-top:12px}

/* ---------- unified shell ----------
 * The system monitor is the primary shell; the Loop console (/console) is
 * embedded seamlessly for console routes. Group labels segment the sidebar
 * into SYSTEM and LOOP CONSOLE sections.
 */
.nav-group{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--ink-faint);
  text-transform:uppercase;padding:12px 12px 4px;user-select:none;white-space:nowrap;
}
.nav .nav-group:first-child{padding-top:2px}
/* Host for the embedded console: fills the content column, framed like a
 * card so the guest app reads as part of this interface, not a portal. */
.loop-host{
  flex:1 1 auto;display:flex;flex-direction:column;min-height:420px;
  border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;background:var(--bg2);
}
.embed-frame{flex:1;width:100%;border:0;background:transparent}
/* Wider windows buy wider charts instead of more margin. */
@media (min-width:1800px){.content-inner{max-width:1760px}}

}

<body>
<div class="app">

    </div>

  </aside>

          <option value="10000">10s</option>
        </select>
      </div>
      <div class="refresh-note" id="refreshNote"></div>
