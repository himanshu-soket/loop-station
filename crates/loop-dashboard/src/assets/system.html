<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loop · system monitor</title>
<style>
:root{
  --bg:#07090d; --bg2:#0b0e14; --panel:#10141d; --panel2:#151a25;
  --line:#1d2433; --line2:#2a3347;
  --ink:#e8ecf4; --ink-dim:#9aa5b8; --ink-faint:#5d687e;
  --acc:#5ef2c0; --acc-dim:#2ea886;
  --amber:#ffc857; --red:#ff6b81; --blue:#6fb7ff; --violet:#b48cff;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --rad:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;overflow-x:hidden;
  background-image:radial-gradient(1100px 500px at 85% -10%,rgba(94,242,192,.05),transparent 60%),radial-gradient(900px 480px at -10% 110%,rgba(180,140,255,.04),transparent 60%)}
::selection{background:rgba(94,242,192,.25)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;min-height:100vh}
.sidebar{width:228px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden;z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.brand-mark{width:34px;height:34px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#0f2b23,#123a2e);border:1px solid #1e5945;color:var(--acc);font-family:var(--mono);font-weight:700;font-size:15px;box-shadow:0 0 22px rgba(94,242,192,.14) inset}
.brand-name{font-weight:800;font-size:15px;letter-spacing:-.02em}
.brand-sub{font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.12em;text-transform:uppercase}
.nav{padding:14px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--ink-dim);font-weight:500;font-size:13.5px;white-space:nowrap;border:1px solid transparent;transition:all .16s}
.nav-item:hover{color:var(--ink);background:var(--panel)}
.nav-item.active{color:var(--acc);background:rgba(94,242,192,.1);border-color:rgba(94,242,192,.22)}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.side-foot{padding:14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:7px;animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(94,242,192,.5)}50%{opacity:.55;box-shadow:0 0 0 5px rgba(94,242,192,0)}}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--line);background:rgba(11,14,20,.85);backdrop-filter:blur(9px);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.page-title{font-size:16px;font-weight:600;letter-spacing:-.01em}
.page-sub{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:1px}
.topbar-spacer{flex:1}
.interval-ctrl{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
.interval-ctrl select{background:var(--bg);border:1px solid var(--line2);color:var(--ink);border-radius:9px;padding:5px 9px;font-family:var(--mono);font-size:11.5px;outline:none}
.refresh-note{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
.content{padding:24px 26px 60px;max-width:1460px;width:100%;margin:0 auto}

.demo-banner{background:rgba(255,200,87,.09);border:1px solid rgba(255,200,87,.35);color:var(--amber);border-radius:12px;padding:10px 16px;margin-bottom:20px;font-size:13px;display:flex;gap:10px;align-items:center}
.error-banner{background:rgba(255,107,129,.08);border:1px solid rgba(255,107,129,.35);color:var(--red);border-radius:12px;padding:10px 16px;margin-bottom:20px;font-size:13px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:15px 16px 13px;position:relative;overflow:hidden;transition:transform .2s,border-color .2s}
.kpi:hover{transform:translateY(-2px);border-color:var(--line2)}
.kpi-label{font-family:var(--mono);font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.11em;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;cursor:help}
.kpi-value{font-size:26px;font-weight:700;letter-spacing:-.02em;font-family:var(--mono)}
.kpi-sub{font-family:var(--mono);font-size:11px;color:var(--ink-dim);margin-top:4px}
.kpi.unavail .kpi-value{color:var(--ink-faint);font-size:18px}
.bar{height:5px;border-radius:4px;background:var(--bg);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .4s ease}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:16px 18px}
.card h3{font-size:13px;font-weight:600;letter-spacing:.01em;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.card .hint{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-bottom:12px}
.chart-wrap{width:100%;position:relative}
.chart-wrap svg{display:block;width:100%}

.core-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px;margin-top:10px}
.core{border-radius:9px;border:1px solid var(--line);background:var(--bg);padding:7px 6px;text-align:center;transition:all .3s}
.core-id{font-family:var(--mono);font-size:9px;color:var(--ink-faint)}
.core-pct{font-family:var(--mono);font-size:13px;font-weight:600;margin-top:2px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--ink-dim)}
th.sorted{color:var(--acc)}
td{padding:7px 10px;border-bottom:1px solid rgba(29,36,51,.55);font-family:var(--mono);font-size:12px;white-space:nowrap}
tr:hover td{background:rgba(21,26,37,.5)}
.proc-search{background:var(--bg);border:1px solid var(--line2);color:var(--ink);border-radius:10px;padding:8px 13px;font-family:var(--mono);font-size:12px;outline:none;width:260px;max-width:100%}
.proc-search:focus{border-color:var(--acc-dim)}
.table-scroll{overflow-x:auto;margin-top:12px}
.muted{color:var(--ink-faint)}
.dim{color:var(--ink-dim)}
.acc{color:var(--acc)}
.amber{color:var(--amber)}
.red{color:var(--red)}
.blue{color:var(--blue)}
.violet{color:var(--violet)}

.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--ink-dim)}
.chip.ok{border-color:rgba(94,242,192,.3);color:var(--acc)}
.chip.warn{border-color:rgba(255,200,87,.35);color:var(--amber)}
.chip.bad{border-color:rgba(255,107,129,.35);color:var(--red)}
.chip.na{border-color:var(--line2);color:var(--ink-faint)}

.skeleton{background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.loading-msg{font-family:var(--mono);font-size:12px;color:var(--ink-faint);padding:40px;text-align:center}

.vol-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid rgba(29,36,51,.5)}
.vol-row:last-child{border-bottom:none}
.vol-name{font-weight:600;font-size:13px}
.vol-mount{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
.vol-bar{flex:1;height:7px;border-radius:5px;background:var(--bg);overflow:hidden;min-width:80px}
.vol-bar i{display:block;height:100%;border-radius:5px}
.vol-size{font-family:var(--mono);font-size:11px;color:var(--ink-dim);text-align:right;min-width:150px}

.iface-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(29,36,51,.5);font-family:var(--mono);font-size:12px;align-items:center}
.iface-row:last-child{border-bottom:none}

footer.note{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:28px;line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:860px){
  .sidebar{display:none}
  .content{padding:16px 14px 40px}
  .topbar{padding:12px 14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">L</div>
      <div><div class="brand-name">loop system</div><div class="brand-sub">local monitor</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><span class="live-dot"></span><span id="footStatus">connecting…</span></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div>
        <div class="page-title" id="pageTitle">Overview</div>
        <div class="page-sub" id="pageSub">—</div>
      </div>
      <div class="topbar-spacer"></div>
      <div class="interval-ctrl">
        <span>sampling</span>
        <select id="intervalSel">
          <option value="500">0.5 s</option>
          <option value="1000">1 s</option>
          <option value="2000" selected>2 s</option>
          <option value="5000">5 s</option>
          <option value="10000">10 s</option>
        </select>
      </div>
      <div class="refresh-note" id="refreshNote"></div>
    </div>
    <main class="content" id="content">
      <div class="loading-msg">collecting first samples…</div>
    </main>
  </div>
</div>

<script>
'use strict';
/* ============ state ============ */
const S = {
  view: 'overview',
  demo: false,
  error: null,
  overview: null,
  snapshot: null,
  history: null,
  procQuery: '',
  procSort: 'cpu',
  procDir: 'desc',
  procLimit: 50,
  lastFetch: 0,
};

const VIEWS = [
  ['overview','Overview','M'],
  ['cpu','CPU','C'],
  ['memory','Memory','M'],
  ['disk','Disk','D'],
  ['network','Network','N'],
  ['gpu','GPU &amp; Thermals','G'],
  ['battery','Battery','B'],
  ['processes','Processes','P'],
];

/* ============ helpers ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtBytes(b, digits=1){
  if (b == null || !isFinite(b)) return '—';
  if (b < 1024) return b.toFixed(0)+' B';
  const u=['KB','MB','GB','TB','PB']; let i=-1;
  do { b/=1024; i++; } while (b>=1024 && i<u.length-1);
  return b.toFixed(digits)+' '+u[i];
}
function fmtRate(bps){ return bps==null||!isFinite(bps) ? '—' : fmtBytes(bps)+'/s'; }
function fmtPct(v, d=1){ return v==null||!isFinite(v) ? '—' : v.toFixed(d)+'%'; }
function fmtMs(ms){ return new Date(ms).toLocaleTimeString(); }
function ago(ms){
  if(!ms) return 'never';
  const s=Math.max(0,(Date.now()-ms)/1000);
  if(s<60) return Math.round(s)+'s ago';
  if(s<3600) return Math.round(s/60)+'m ago';
  return Math.round(s/3600)+'h ago';
}
// tooltip via title attribute (no external libs)
const tip = txt => `title="${esc(txt)}"`;

/* metric renderer: value or honest unavailable chip */
function mval(m, fmt){
  if (m && m.available && m.value != null) return fmt ? fmt(m.value) : m.value;
  return null;
}
function metricKpi(label, m, fmt, sub){
  const v = mval(m, fmt);
  const reason = m && !m.available ? (m.unavailableReason||'unavailable') : '';
  return `<div class="kpi ${v==null?'unavail':''}">
    <div class="kpi-label" ${tip((m&&m.description)||label)}>${esc(label)}<span>ⓘ</span></div>
    <div class="kpi-value">${v==null?'unavailable':esc(v)}</div>
    <div class="kpi-sub">${v==null?esc(reason):esc(sub||'')}</div>
  </div>`;
}
function chip(text, cls){ return `<span class="chip ${cls||''}">${esc(text)}</span>`; }

/* ============ SVG charts (hand-rolled, no deps) ============ */
function lineChart(series, opts){
  // series: [{name,color,points:[{t,v}]}]
  opts = opts||{};
  const W=600,H=170,PAD_L=46,PAD_R=10,PAD_T=12,PAD_B=22;
  const all=series.flatMap(s=>s.points);
  if(!all.length) return `<div class="loading-msg">waiting for samples…</div>`;
  let t0=all[0].t, t1=all[all.length-1].t;
  if(t1===t0) t1=t0+1;
  let vmax=opts.max!=null?opts.max:Math.max(...all.map(p=>isFinite(p.v)?p.v:0),0.0001)*1.15;
  if(opts.min!=null) vmax=Math.max(vmax,opts.min);
  const x=t=>PAD_L+(t-t0)/(t1-t0)*(W-PAD_L-PAD_R);
  const y=v=>H-PAD_B-(Math.max(0,Math.min(v,vmax))/vmax)*(H-PAD_T-PAD_B);

  let out=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${opts.height||170}px">`;
  // gridlines + y labels
  const steps=4;
  for(let i=0;i<=steps;i++){
    const v=vmax*i/steps, yy=y(v);
    out+=`<line x1="${PAD_L}" y1="${yy}" x2="${W-PAD_R}" y2="${yy}" stroke="#1d2433" stroke-width="1"/>`;
    out+=`<text x="${PAD_L-6}" y="${yy+3.5}" text-anchor="end" font-size="9" fill="#5d687e" font-family="ui-monospace,monospace">${opts.fmtY?opts.fmtY(v):Math.round(v)}</text>`;
  }
  // time labels
  out+=`<text x="${PAD_L}" y="${H-6}" font-size="9" fill="#5d687e" font-family="ui-monospace,monospace">${fmtMs(t0)}</text>`;
  out+=`<text x="${W-PAD_R}" y="${H-6}" text-anchor="end" font-size="9" fill="#5d687e" font-family="ui-monospace,monospace">${fmtMs(t1)}</text>`;

  for(const s of series){
    const pts=s.points.filter(p=>isFinite(p.v));
    if(pts.length<2){ if(pts.length===1) out+=`<circle cx="${x(pts[0].t)}" cy="${y(pts[0].v)}" r="2.5" fill="${s.color}"/>`; continue; }
    let d=`M ${x(pts[0].t)} ${y(pts[0].v)}`;
    for(let i=1;i<pts.length;i++) d+=` L ${x(pts[i].t)} ${y(pts[i].v)}`;
    // area fill
    if(!opts.noArea){
      out+=`<path d="${d} L ${x(pts[pts.length-1].t)} ${H-PAD_B} L ${x(pts[0].t)} ${H-PAD_B} Z" fill="${s.color}" opacity="0.08"/>`;
    }
    out+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  out+='</svg>';
  // legend
  out+='<div style="display:flex;gap:14px;margin-top:6px;flex-wrap:wrap">'+series.map(s=>
    `<span style="font-family:var(--mono);font-size:10.5px;color:var(--ink-dim)"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${s.color};margin-right:5px"></i>${esc(s.name)}</span>`).join('')+'</div>';
  return out;
}

/* ============ data fetching ============ */
async function jget(url){
  const r=await fetch(url);
  if(!r.ok){ const t=await r.text().catch(()=>''); throw new Error(`${r.status}: ${t.slice(0,200)}`); }
  return r.json();
}
async function refresh(){
  try{
    S.error=null;
    const [ov,snap,hist]=await Promise.all([
      jget('/api/sys/overview'),
      jget('/api/sys/snapshot'),
      jget('/api/sys/history'),
    ]);
    S.overview=ov; S.snapshot=snap; S.history=hist; S.demo=!!ov.demo;
    S.lastFetch=Date.now();
    $('footStatus').textContent = S.demo ? 'DEMO DATA' : 'live · local';
  }catch(e){
    S.error=e.message;
    $('footStatus').textContent='error';
  }
  render();
}
async function refreshProcesses(){
  if(S.view!=='processes') return;
  try{
    const q=new URLSearchParams({q:S.procQuery,sort:S.procSort,dir:S.procDir,limit:S.procLimit});
    const r=await jget('/api/sys/processes?'+q);
    S.procData=r;
  }catch(e){ S.error=e.message; }
  render();
}

/* ============ views ============ */
function kpiRow(){
  const o=S.overview,s=S.snapshot;
  if(!o) return '';
  let cards='';
  cards+=`<div class="kpi"><div class="kpi-label" ${tip('Aggregate busy percentage across all logical cores')}>CPU<span>ⓘ</span></div>
    <div class="kpi-value">${fmtPct(o.cpuPercent)}</div>
    <div class="kpi-sub">user ${fmtPct(o.cpuUserPercent,0)} · sys ${fmtPct(o.cpuSystemPercent,0)}</div>
    <div class="bar"><i style="width:${Math.min(100,o.cpuPercent)}%;background:var(--acc)"></i></div></div>`;
  const memPct=o.memoryTotalBytes?100*o.memoryUsedBytes/o.memoryTotalBytes:0;
  cards+=`<div class="kpi"><div class="kpi-label" ${tip('Apparent used memory (wired + compressed + app). File cache is reclaimable and not counted.')}>MEMORY<span>ⓘ</span></div>
    <div class="kpi-value">${fmtBytes(o.memoryUsedBytes,1)}</div>
    <div class="kpi-sub">of ${fmtBytes(o.memoryTotalBytes,0)} · swap ${o.swapUsedBytes!=null?fmtBytes(o.swapUsedBytes,1):'n/a'}</div>
    <div class="bar"><i style="width:${Math.min(100,memPct)}%;background:var(--violet)"></i></div></div>`;
  cards+=`<div class="kpi"><div class="kpi-label" ${tip('Disk read throughput across all volumes since the previous sample')}>DISK READ<span>ⓘ</span></div>
    <div class="kpi-value">${o.diskReadPerSec!=null?fmtRate(o.diskReadPerSec):'unavailable'}</div>
    <div class="kpi-sub">${o.diskWritePerSec!=null?'write '+fmtRate(o.diskWritePerSec):'counter window pending'}</div></div>`;
  cards+=`<div class="kpi"><div class="kpi-label" ${tip('Download rate summed over physical interfaces (loopback excluded)')}>DOWNLOAD<span>ⓘ</span></div>
    <div class="kpi-value">${fmtRate(o.netRecvPerSec)}</div>
    <div class="kpi-sub">upload ${fmtRate(o.netSentPerSec)}</div></div>`;
  if(s&&s.gpu){
    const g=s.gpu;
    const gu=g.utilizationPercent&&g.utilizationPercent.available?g.utilizationPercent.value:null;
    cards+=`<div class="kpi ${gu==null?'unavail':''}"><div class="kpi-label" ${tip('GPU device utilization from IOKit PerformanceStatistics')}>GPU<span>ⓘ</span></div>
      <div class="kpi-value">${gu!=null?fmtPct(gu):'unavailable'}</div>
      <div class="kpi-sub">${g.model&&g.model.available?esc(g.model.value):''}</div></div>`;
  }
  if(s&&s.battery){
    const b=s.battery;
    const bp=b.chargePercent&&b.chargePercent.available?b.chargePercent.value:null;
    if(bp!=null){
      cards+=`<div class="kpi"><div class="kpi-label" ${tip('Battery charge percentage')}>BATTERY<span>ⓘ</span></div>
      <div class="kpi-value">${fmtPct(bp,0)}</div>
      <div class="kpi-sub">${b.status&&b.status.available?esc(b.status.value):''}${b.timeRemainingMinutes&&b.timeRemainingMinutes.available?' · '+esc(b.timeRemainingMinutes.value)+' min':''}</div>
      <div class="bar"><i style="width:${bp}%;background:${bp<20?'var(--red)':bp<50?'var(--amber)':'var(--acc)'}"></i></div></div>`;
    }
  }
  cards+=`<div class="kpi"><div class="kpi-label" ${tip('Number of processes visible to this user')}>PROCESSES<span>ⓘ</span></div>
    <div class="kpi-value">${o.processCount}</div>
    <div class="kpi-sub">sample #${o.sampleCount}</div></div>`;
  return `<div class="kpis">${cards}</div>`;
}

function histSeries(){
  const h=S.history; if(!h) return {};
  const P=k=>(h[k]||[]).map(p=>({t:p.t,v:p.v}));
  return {
    cpu:[{name:'total %',color:'#5ef2c0',points:P('cpuPercent')},
         {name:'user %',color:'#6fb7ff',points:P('cpuUserPercent')},
         {name:'system %',color:'#ffc857',points:P('cpuSystemPercent')}],
    mem:[{name:'used',color:'#b48cff',points:P('memoryUsedBytes')},
         {name:'swap used',color:'#ff6b81',points:P('swapUsedBytes')}],
    disk:[{name:'read/s',color:'#5ef2c0',points:P('diskReadPerSec')},
          {name:'write/s',color:'#ffc857',points:P('diskWritePerSec')}],
    net:[{name:'download/s',color:'#6fb7ff',points:P('netRecvPer_sec'.replace('_sec','PerSec'))},
         {name:'upload/s',color:'#5ef2c0',points:P('netSentPerSec')}],
  };
}

function coreGrid(cores){
  if(!cores||!cores.length) return `<div class="loading-msg">per-core data appears after the second sample (~${S.overview?Math.round(S.overview.intervalMs/1000):2}s)</div>`;
  return '<div class="core-grid">'+cores.map(c=>{
    const heat=c.totalPercent;
    const bg=`rgba(94,242,192,${(0.06+0.5*Math.min(1,heat/100)).toFixed(3)})`;
    return `<div class="core" style="background:${bg};border-color:rgba(94,242,192,${(0.15+0.45*Math.min(1,heat/100)).toFixed(3)})">
      <div class="core-id">core ${c.index}</div>
      <div class="core-pct">${c.totalPercent.toFixed(0)}%</div></div>`;
  }).join('')+'</div>';
}

function volumeRows(vols){
  if(!vols||!vols.length) return '<div class="loading-msg">no volumes reported</div>';
  return vols.map(v=>{
    const used=v.totalBytes-v.availableBytes;
    const pct=v.totalBytes?100*used/v.totalBytes:0;
    const col=pct>90?'var(--red)':pct>75?'var(--amber)':'var(--acc)';
    return `<div class="vol-row">
      <div style="min-width:130px"><div class="vol-name">${esc(v.name)}</div><div class="vol-mount">${esc(v.mountPoint)} · ${esc(v.fileSystem)}${v.removable?' · removable':''}</div></div>
      <div class="vol-bar"><i style="width:${Math.min(100,pct)}%;background:${col}"></i></div>
      <div class="vol-size">${fmtBytes(used,1)} used<br><span class="muted">${fmtBytes(v.availableBytes,1)} free of ${fmtBytes(v.totalBytes,0)}</span></div>
    </div>`;
  }).join('');
}

function ifaceRows(ifaces){
  if(!ifaces||!ifaces.length) return '<div class="loading-msg">no interfaces reported</div>';
  const sorted=[...ifaces].sort((a,b)=>(b.receivedPerSec+b.transmittedPerSec)-(a.receivedPerSec+a.transmittedPerSec));
  return sorted.map(i=>`<div class="iface-row">
    <span>${esc(i.name)} ${i.active?chip('active','ok'):chip('idle','na')}</span>
    <span class="dim">↓ ${fmtRate(i.receivedPerSec)} · ↑ ${fmtRate(i.transmittedPerSec)}</span>
    <span class="muted">Σ ↓${fmtBytes(i.totalReceived,0)} ↑${fmtBytes(i.totalTransmitted,0)}</span>
  </div>`).join('');
}

function metricLine(label,m,fmt){
  const v=mval(m,fmt);
  return `<div class="iface-row"><span>${esc(label)}</span>${
    v!=null?`<span class="acc">${esc(v)}</span>`:`<span class="chip na" ${tip(m.unavailableReason||'')}>unavailable — ${esc(m.unavailableReason||'not readable')}</span>`
  }</div>`;
}

function processTable(){
  const d=S.procData;
  if(!d) return '<div class="loading-msg">loading processes…</div>';
  const th=(key,label,extra)=>`<th data-k="${key}" class="${S.procSort===key?'sorted':''}">${label}${S.procSort===key?(S.procDir==='desc'?' ↓':' ↑'):''}</th>`;
  const rows=d.items.map(p=>`<tr>
    <td class="muted">${p.pid}</td>
    <td style="font-family:var(--sans)">${esc(p.name)}</td>
    <td class="${p.cpuPercent>50?'red':p.cpuPercent>10?'amber':''}">${p.cpuPercent.toFixed(1)}%</td>
    <td>${p.memoryReadable===false?'<span class="muted" title="macOS denies reading other users\' process memory without root">n/a</span>':fmtBytes(p.memoryBytes,1)}</td>
  </tr>`).join('');
  return `
  <input id="procSearch" class="proc-search" type="text" placeholder="search by name or pid…" value="${esc(S.procQuery)}">
  <span class="muted" style="font-family:var(--mono);font-size:11px;margin-left:10px">showing ${d.items.length} of ${d.total}${S.demo?' · DEMO':''}</span>
  <div class="table-scroll"><table>
    <thead><tr>${th('pid','PID')}${th('name','Process')}${th('cpu','CPU %')}${th('memory','Memory')}</tr></thead>
    <tbody>${rows||'<tr><td colspan="4" class="muted" style="text-align:center;padding:20px">no matching processes</td></tr>'}</tbody>
  </table></div>
  <div class="hint" style="font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:10px">
    read-only view — this dashboard never terminates processes</div>`;
}

function render(){
  // nav
  $('nav').innerHTML=VIEWS.map(([id,label])=>
    `<div class="nav-item ${S.view===id?'active':''}" data-view="${id}">${label.replace(/^./,c=>c)}</div>`).join('');
  $('nav').querySelectorAll('.nav-item').forEach(el=>el.onclick=()=>{S.view=el.dataset.view;render();if(S.view==='processes')refreshProcesses();});

  const titles={overview:['Overview','system summary'],cpu:['CPU','processor load'],memory:['Memory','RAM &amp; swap'],
    disk:['Disk','volumes &amp; I/O'],network:['Network','interfaces &amp; throughput'],gpu:['GPU &amp; Thermals','graphics &amp; thermal state'],
    battery:['Battery','power &amp; health'],processes:['Processes','read-only process table']};
  $('pageTitle').innerHTML=titles[S.view][0];
  $('pageSub').innerHTML=titles[S.view][1]+(S.demo?' · <span class="amber">DEMO DATA</span>':'');
  $('refreshNote').textContent=`updated ${ago(S.lastFetch)} · every ${S.overview?S.overview.intervalMs:2000} ms`;

  let html='';
  if(S.error) html+=`<div class="error-banner">failed to fetch metrics: ${esc(S.error)} — retrying…</div>`;
  if(S.demo) html+=`<div class="demo-banner">⚠ DEMO MODE — these are synthetic metrics for offline UI testing, not real measurements from this Mac.</div>`;

  const snap=S.snapshot, hs=histSeries();

  if(S.view==='overview'){
    html+=kpiRow();
    html+=`<div class="grid">
      <div class="card"><h3>CPU load</h3><div class="hint">busy % across all cores, since the monitor started</div><div class="chart-wrap">${lineChart(hs.cpu,{max:100,fmtY:v=>v.toFixed(0)+'%'})}</div></div>
      <div class="card"><h3>Memory pressure</h3><div class="hint">used RAM and swap over time</div><div class="chart-wrap">${lineChart(hs.mem,{fmtY:v=>fmtBytes(v,0)})}</div></div>
      <div class="card"><h3>Network throughput</h3><div class="hint">physical interfaces, loopback excluded</div><div class="chart-wrap">${lineChart(hs.net,{fmtY:v=>fmtBytes(v,0)})}</div></div>
      <div class="card"><h3>Disk throughput</h3><div class="hint">reads and writes per second</div><div class="chart-wrap">${lineChart(hs.disk,{fmtY:v=>fmtBytes(v,0)})}</div></div>
    </div>`;
  }
  else if(S.view==='cpu'){
    const c=snap&&snap.cpu;
    if(c){
      html+=`<div class="kpis">
        <div class="kpi"><div class="kpi-label">TOTAL</div><div class="kpi-value">${fmtPct(c.usagePercent)}</div><div class="kpi-sub">user ${fmtPct(c.userPercent,0)} · sys ${fmtPct(c.systemPercent,0)} · idle ${fmtPct(c.idlePercent,0)}</div><div class="bar"><i style="width:${Math.min(100,c.usagePercent)}%;background:var(--acc)"></i></div></div>
        <div class="kpi"><div class="kpi-label">CORES</div><div class="kpi-value">${c.logical_cores??c.logicalCores??'—'}</div><div class="kpi-sub">${c.physicalCores!=null?c.physicalCores+' physical':''}</div></div>
        <div class="kpi"><div class="kpi-label">LOAD AVG</div><div class="kpi-value" style="font-size:19px">${c.loadAverage?(''+c.loadAverage.one.toFixed(2)+' '+c.loadAverage.five.toFixed(2)+' '+c.loadAverage.fifteen.toFixed(2)):'—'}</div><div class="kpi-sub">1 / 5 / 15 min</div></div>
        <div class="kpi"><div class="kpi-label">CHIP</div><div class="kpi-value" style="font-size:17px">${c.brand?esc(c.brand):'—'}</div><div class="kpi-sub">user/system/idle from Mach tick counters</div></div>
      </div>`;
      html+=`<div class="card"><h3>Per-core usage</h3><div class="hint">each cell is one logical core; brightness tracks load</div>${coreGrid(c.cores)}</div>`;
      html+=`<div class="card" style="margin-top:16px"><h3>History</h3><div class="hint">user / system / total since the monitor started</div><div class="chart-wrap">${lineChart(hs.cpu,{max:100,fmtY:v=>v.toFixed(0)+'%'})}</div></div>`;
    }
  }
  else if(S.view==='memory'){
    const m=snap&&snap.memory;
    if(m){
      const pct=m.totalBytes?100*m.usedBytes/m.totalBytes:0;
      html+=`<div class="kpis">
        <div class="kpi"><div class="kpi-label" ${tip('macOS "used" = wired + compressed + app memory; file cache excluded because it is reclaimable')}>USED<span>ⓘ</span></div><div class="kpi-value">${fmtBytes(m.usedBytes,1)}</div><div class="kpi-sub">of ${fmtBytes(m.totalBytes,0)} physical</div><div class="bar"><i style="width:${Math.min(100,pct)}%;background:var(--violet)"></i></div></div>
        <div class="kpi"><div class="kpi-label" ${tip('Memory the system can reclaim under pressure — what Activity Monitor calls "available"')}>AVAILABLE<span>ⓘ</span></div><div class="kpi-value">${fmtBytes(m.availableBytes,1)}</div><div class="kpi-sub">free ${fmtBytes(m.freeBytes,1)}</div></div>
        <div class="kpi"><div class="kpi-label">SWAP USED</div><div class="kpi-value">${m.swapUsedBytes!=null?fmtBytes(m.swapUsedBytes,1):'—'}</div><div class="kpi-sub">of ${fmtBytes(m.swapTotalBytes,0)} swap space</div><div class="bar"><i style="width:${m.swapTotalBytes?Math.min(100,100*m.swapUsedBytes/m.swapTotalBytes):0}%;background:var(--amber)"></i></div></div>
        <div class="kpi"><div class="kpi-label">PRESSURE</div><div class="kpi-value" style="font-size:19px">${m.pressureLevel!=null?esc(({1:'nominal',2:'warning',3:'critical'})[m.pressureLevel]||('level '+m.pressureLevel)):'—'}</div><div class="kpi-sub">kernel memorystatus level</div></div>
      </div>`;
      html+=`<div class="card"><h3>History</h3><div class="hint">used memory and swap over time</div><div class="chart-wrap">${lineChart(hs.mem,{fmtY:v=>fmtBytes(v,0)})}</div></div>`;
      html+=`<div class="card" style="margin-top:16px"><h3>About macOS memory semantics</h3>
        <div class="hint" style="line-height:1.8">A near-zero <b>free</b> value is normal and healthy: macOS fills RAM with reclaimable file cache.
        <b>Available</b> = free + cached memory reclaimable under pressure. <b>Used</b> follows Activity Monitor's "app memory + wired + compressed".
        Swap usage is cumulative since boot and does not by itself indicate a problem.</div></div>`;
    }
  }
  else if(S.view==='disk'){
    const d=snap;
    if(d){
      const io=d.diskIo||{};
      html+=`<div class="kpis">
        <div class="kpi"><div class="kpi-label">READ RATE</div><div class="kpi-value">${io.valid?fmtRate(io.readBytesPerSec):'pending'}</div><div class="kpi-sub">last ${Math.round((S.overview&&S.overview.intervalMs)||2000)} ms window</div></div>
        <div class="kpi"><div class="kpi-label">WRITE RATE</div><div class="kpi-value">${io.valid?fmtRate(io.writtenBytesPerSec):'pending'}</div><div class="kpi-sub">${io.valid?fmtBytes(io.writtenBytes,1)+' written in window':'first sample seeds counters'}</div></div>
      </div>`;
      html+=`<div class="card"><h3>Volumes</h3><div class="hint">mounted filesystems and capacity</div>${volumeRows(d.volumes)}</div>`;
      html+=`<div class="card" style="margin-top:16px"><h3>Throughput history</h3><div class="hint">reads and writes per second since the monitor started</div><div class="chart-wrap">${lineChart(hs.disk,{fmtY:v=>fmtBytes(v,0)})}</div></div>`;
    }
  }
  else if(S.view==='network'){
    const n=snap;
    if(n){
      const t=n.networkTotals||{};
      html+=`<div class="kpis">
        <div class="kpi"><div class="kpi-label">DOWNLOAD</div><div class="kpi-value">${fmtRate(t.receivedPerSec)}</div><div class="kpi-sub">Σ ${fmtBytes(t.totalReceived,1)}</div></div>
        <div class="kpi"><div class="kpi-label">UPLOAD</div><div class="kpi-value">${fmtRate(t.transmittedPerSec)}</div><div class="kpi-sub">Σ ${fmtBytes(t.totalTransmitted,1)}</div></div>
      </div>`;
      html+=`<div class="card"><h3>Interfaces</h3><div class="hint">live rates and lifetime totals per interface</div>${ifaceRows(n.interfaces)}</div>`;
      html+=`<div class="card" style="margin-top:16px"><h3>Throughput history</h3><div class="hint">physical interfaces aggregated, loopback excluded</div><div class="chart-wrap">${lineChart(hs.net,{fmtY:v=>fmtBytes(v,0)})}</div></div>`;
    }
  }
  else if(S.view==='gpu'){
    const g=snap&&snap.gpu;
    if(g){
      html+=`<div class="kpis">${metricKpi('UTILIZATION',g.utilizationPercent,v=>fmtPct(v))}
        ${metricKpi('RENDERER',g.rendererUtilizationPercent,v=>fmtPct(v))}
        ${metricKpi('TILER',g.tilerUtilizationPercent,v=>fmtPct(v))}
        ${metricKpi('GPU MEMORY',g.memoryUsedBytes,v=>fmtBytes(v,1))}
        ${metricKpi('TEMPERATURE',g.temperatureCelsius,v=>v.toFixed(0)+' °C')}
        ${metricKpi('THERMAL PRESSURE',g.thermalPressure)}</div>`;
      html+=`<div class="card"><h3>Reading GPU metrics on macOS</h3>
        <div class="hint" style="line-height:1.8">Utilization comes from IOKit's <span class="acc">AGXAccelerator</span> PerformanceStatistics — readable without root.
        GPU <b>temperature</b> requires <span class="mono">sudo powermetrics</span>, so this dashboard marks it unavailable instead of estimating it.
        Thermal pressure comes from <span class="mono">pmset -g therm</span>.</div></div>`;
    }
  }
  else if(S.view==='battery'){
    const b=snap&&snap.battery;
    if(b){
      html+=`<div class="kpis">${metricKpi('CHARGE',b.chargePercent,v=>fmtPct(v,0))}
        ${metricKpi('STATUS',b.status)}
        ${metricKpi('TIME LEFT',b.timeRemainingMinutes,v=>v+' min')}
        ${metricKpi('HEALTH',b.healthPercent,v=>fmtPct(v,1))}
        ${metricKpi('CYCLES',b.cycleCount,v=>''+v)}</div>`;
      html+=`<div class="card"><h3>Capacity detail</h3><div class="hint">from AppleSmartBattery via ioreg</div>
        ${metricLine('Design capacity',b.designCapacity_mah||b.designCapacityMah,v=>v+' mAh')}
        ${metricLine('Full-charge capacity',b.maxCapacity_mah||b.maxCapacityMah,v=>v+' mAh')}
        ${metricLine('Health (full/design)',b.healthPercent,v=>fmtPct(v,1))}</div>`;
    }
  }
  else if(S.view==='processes'){
    html+=`<div class="card">${processTable()}</div>`;
  }

  html+=`<footer class="note">
    Metrics are collected locally by sampling this Mac every ${S.overview?S.overview.intervalMs:2000} ms — nothing leaves localhost.
    CPU percentages derive from Mach per-core tick deltas; memory follows macOS Activity Monitor semantics; GPU utilization from IOKit; battery from AppleSmartBattery.
    History covers only this monitor's runtime (${S.history?Math.max(...['cpuPercent','memoryUsedBytes','netRecvPerSec'].map(k=>(S.history[k]||[]).length),0)} samples) and is kept in memory, never written to disk.
    Unavailable metrics are shown as unavailable with their reason — values are never fabricated.
  </footer>`;

  $('content').innerHTML=html;

  // wire process-table interactions
  const search=$('procSearch');
  if(search){
    let deb;
    search.oninput=()=>{clearTimeout(deb);deb=setTimeout(()=>{S.procQuery=search.value;refreshProcesses();},250);};
    document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
      const k=th.dataset.k;
      if(S.procSort===k) S.procDir=S.procDir==='desc'?'asc':'desc';
      else {S.procSort=k;S.procDir='desc';}
      refreshProcesses();
    });
  }
}

/* ============ interval control ============ */
$('intervalSel').onchange=async e=>{
  const ms=+e.target.value;
  try{
    const r=await fetch('/api/sys/interval',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ms})});
    if(!r.ok) throw new Error(await r.text());
    refresh();
  }catch(err){ S.error='interval change failed: '+err.message; render(); }
};

/* ============ boot ============ */
(async function boot(){
  await refresh();
  const iv=()=>refresh();
  window.setInterval(iv, Math.max(1500, S.overview?S.overview.intervalMs:2000));
  window.setInterval(()=>{ if(S.view==='processes') refreshProcesses(); }, 3000);
})();
</script>
</body>
</html>
