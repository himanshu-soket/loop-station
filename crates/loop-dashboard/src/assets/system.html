        <div class="loading-msg" id="bootMsg">collecting first samples…</div>
      </div>
    </main>
  </div>
</div>

<script>
'use strict';

/* ================================================================
   State
   ================================================================ */
const VIEWS = [
  ['overview',  'Overview',  'M0 3h18v6H3zM3 11h8v10H3zM13 11h8v10h-8z'],
  ['cpu',       'CPU',       'M9 3a3 3 0 0 1 6 0v5a3 3 0 0 1-6 0zM6 9a3 3 0 0 1 6 0v3a3 3 0 0 1-6 0zM12 9a3 3 0 0 1 6 0v3a3 3 0 0 1-6 0zM9 15a3 3 0 0 1 6 0v3a3 3 0 0 1-6 0z'],
  ['memory',    'Memory',    'M4 6h16v12H4zM8 10h2v2H8zM14 10h2v2h-2z'],
  ['disk',      'Disk',      'M4 5h16v6H4zM4 13h16v6H4zM8 8h.01M8 16h.01'],
  ['network',   'Network',   'M12 3v6m0 6v6M5 12h14M7 7l5 5 5-5M7 17l5-5 5 5'],
  ['gpu',       'GPU',       'M3 7h18v10H3zM7 11h4v2H7zM14 11h3v2h-3z'],
  ['battery',   'Battery',   'M4 9h14v6H4zM18 11h2v2h-2zM7 11h2v2H7z'],
  ['processes', 'Processes', 'M4 6h16M4 12h16M4 18h16'],
];

/* Loop console routes are no longer sidebar items here — they belong to the
 * Loop AI Console workspace (/console), which this shell links to directly.
 * LOOP_ROUTES below still maps any legacy /system#<console-route> deep link
 * to the embedded SPA so old URLs keep working. */

/* Map a unified-shell route to what the embedded console SPA should show:
 * shell route → console hash route. The console's own router takes over
 * from there; its sidebar is hidden while embedded (see console.html). */
const LOOP_ROUTES = {
  console:   'chat',
  models:    'models',
  traces:    'traces',
  analytics: 'analytics',
  settings:  'settings',
};

const S = {
  // Deep-linkable view: /system#cpu, /system#processes, …
  view: (function(){
    const h = decodeURIComponent(location.hash.replace('#','')) || 'overview';
    return VIEWS.some(v => v[0] === h) || LOOP_ROUTES[h] ? h : 'overview';
  })(),
  demo: false,
  error: null,
  overview: null,
  snapshot: null,
  history: null,
  procData: null,
  procQuery: '',
  procSort: 'cpu',
  procDir: 'desc',
  procLimit: 60,
  lastFetch: 0,
  inFlight: false,       // guards against overlapping refreshes
  timerId: null,
  procTimerId: null,
};

const $ = id => document.getElementById(id);
/**
 * JSON embedded in a <script type="application/json"> block. The HTML parser
 * does NOT decode entities inside script elements, so esc() would corrupt it;
 * instead escape only the sequence that could terminate the script tag.
 */
function jsonSafe(json) {
  return String(json).replace(/<\/script/gi, '<\\/script');
}

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================================================================
   Formatting helpers
   ================================================================ */
function fmtBytes(b, digits = 1) {
  if (b == null || !isFinite(b)) return '—';
  if (b < 1024) return Math.round(b) + ' B';
  const u = ['KB','MB','GB','TB','PB'];
  let i = -1;
  do { b /= 1024; i++; } while (b >= 1024 && i < u.length - 1);
  return b.toFixed(digits) + ' ' + u[i];
}
const fmtRate = bps => (bps == null || !isFinite(bps)) ? '—' : fmtBytes(bps) + '/s';
const fmtPct  = (v, d = 1) => (v == null || !isFinite(v)) ? '—' : v.toFixed(d) + '%';
const fmtClock = ms => new Date(ms).toLocaleTimeString([], {hour12:false});
function ago(ms) {
  if (!ms) return 'never';
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 5) return 'just now';
  if (s < 60) return Math.round(s) + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  return Math.round(s / 3600) + 'h ago';
}
function fmtUptime(secs) {
  if (secs == null) return null;
  const d = Math.floor(secs / 86400);
  const h = Math.floor((secs % 86400) / 3600);
  const m = Math.floor((secs % 3600) / 60);
  if (d > 0) return d + 'd ' + h + 'h';
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm';
}
const tip = t => 'title="' + esc(t) + '"';

/*
 * Axis/tooltip formatters shared by charts. Registries reference these by
 * name (JSON cannot serialise functions); resolveFormatters() binds them.
 */
const CHART_FMT = {
  pctY:   function (v) { return v.toFixed(0) + '%'; },
  pctV:   function (v) { return v.toFixed(1) + '%'; },
  bytesY: function (v) { return fmtBytes(v, 0); },
  bytesV: function (v) { return fmtBytes(v, 1); },
  rateV:  function (v) { return fmtBytes(v, 1) + '/s'; },
};
function resolveFormatters(cfg) {
  if (!cfg) return cfg;
  ['fmtY', 'fmtVal'].forEach(function (k) {
    if (typeof cfg[k] === 'string') cfg[k] = CHART_FMT[cfg[k]] || null;
  });
  return cfg;
}

/* Metric wrapper: returns formatted value or null when unavailable. */
function mval(m, fmt) {
  if (m && m.available && m.value != null) return fmt ? fmt(m.value) : m.value;
  return null;
}

/* ================================================================
   Charts (hand-rolled SVG, no dependencies)

   Why this replaced the viewBox-based renderer:
   * The old chart used a fixed 600x160 viewBox with
     preserveAspectRatio="none", so text scaled non-uniformly and the fixed
     48-unit left gutter either clipped y-labels (narrow cards) or wasted
     space (wide cards). Charts could overflow their cards.
   * This version measures its container (ResizeObserver), lays out in CSS
     pixels, sizes the y-gutter from the measured label width, and clips
     only the plot area. Labels always stay inside the card.
   * Interaction: hover crosshair + tooltip with exact values/timestamps,
     clickable legend to toggle series, time-range windows.
   ================================================================ */

/*
 * Per-chart live state, keyed by the chart's stable name (data-chart).
 *
 * render() rebuilds the view DOM on every refresh, so keying by element
 * identity would lose the user's range/series selections every two seconds.
 * The placeholder name is stable for a given chart across rebuilds, and the
 * CHARTS map is pruned when views change.
 *
 * A chart instance keeps its own SVG + controls once mounted; live updates
 * call updateChart() which rewrites only the geometry of the existing DOM,
 * never destroying the element (so hovers, drags and focus survive).
 */
const CHARTS = new Map();
let chartSeq = 0;

/* Load/save the user's per-chart range choice. Storage may be unavailable
 * (private mode, disabled); both directions are guarded. */
const RANGE_KEY = 'loop.sys.chartRange';
function loadSavedRanges() {
  try { return JSON.parse(localStorage.getItem(RANGE_KEY) || '{}') || {}; }
  catch (e) { return {}; }
}
function saveRange(chartName, rangeMs) {
  try {
    const all = loadSavedRanges();
    if (rangeMs == null) delete all[chartName]; else all[chartName] = rangeMs;
    localStorage.setItem(RANGE_KEY, JSON.stringify(all));
  } catch (e) { /* storage unavailable — ranges just won't persist */ }
}

/*
 * Chart viewport model.
 *
 *   Live mode        the window trails the newest sample: [now-w, now].
 *   Historical mode  the window is fixed where the user dragged it; new
 *                    samples are collected silently and do not move it.
 *
 * `rangeMs` is the *window width* (null = all retained history). Entering
 * historical mode is any backward pan; "Back to live" restores trailing.
 */
function freshViewportState() {
  return {
    rangeMs: null,      // window width; null = everything retained
    live: true,         // trailing the newest sample?
    anchor: null,       // historical: newest timestamp the window shows
    hidden: {},         // series name -> hidden?
    ro: null, lastCfg: null, tip: null,
  };
}

/** Resolve the visible [t0, t1] window for a chart's current state. */
function viewportWindow(st, dataT0, dataT1) {
  const span = Math.max(1, dataT1 - dataT0);
  let w = st.rangeMs != null ? st.rangeMs : span;
  if (st.live) {
    // Trail the newest sample.
    return [dataT1 - w, dataT1];
  }
  // Historical: hold the anchor; clamp into available data.
  let end = st.anchor != null ? st.anchor : dataT1;
  end = Math.max(dataT0 + Math.min(w, span) * 0.999, Math.min(end, dataT1));
  return [end - w, end];
}

/* Time-range windows in ms; null = everything collected. */
const RANGES = [
  {label:'all',  ms:null},
  {label:'1m',   ms:60e3},
  {label:'5m',   ms:300e3},
  {label:'15m',  ms:900e3},
  {label:'1h',   ms:3600e3},
];

/* Smallest "nice" bound >= v for the y-axis top. */
function niceCeil(v) {
  if (!(v > 0)) return 1;
  const exp = Math.floor(Math.log10(v));
  const base = Math.pow(10, exp);
  const mult = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  for (let i = 0; i < mult.length; i++) {
    if (base * mult[i] >= v - 1e-9) return base * mult[i];
  }
  return base * 10;
}

/**
 * Create (or update) an interactive line chart inside `el`.
 * cfg: {series:[{name,color,points}], fmtY, fmtVal, max, height, emptyMsg,
 *       warn: value that marks the start of abnormal readings}
 */
function mountChart(el, cfg) {
  // State is keyed by the chart's *name* (data-chart), not a per-element id:
  // render() rebuilds the view DOM on every refresh, so keying by element
  // identity would lose the user's range/series selections every two
  // seconds. The placeholder name is stable for a given chart across
  // rebuilds, and the CHARTS map is pruned when views change.
  const id = el.dataset.chart || ('anon' + (++chartSeq));
  let st = CHARTS.get(id);
  if (!st) {
    st = freshViewportState();
    // Restore a persisted range width (not viewport position).
    const saved = loadSavedRanges()[id];
    if (saved !== undefined) st.rangeMs = saved;
    CHARTS.set(id, st);
  }
  // A fresh element replaces the old one; drop the previous observer and
  // tooltip so they don't leak or fire against detached nodes.
  if (st.el !== el) {
    if (st.ro) { try { st.ro.disconnect(); } catch (e) {} st.ro = null; }
    if (st.tip) { st.tip.remove(); st.tip = null; }
    st.wired = null;   // listeners belong to the old element
    st.el = el;
  }
  st.lastCfg = cfg;

  // Full retained data first (needed to resolve the viewport window), then
  // clip to the viewport. Series visibility is applied before geometry so
  // hidden series never influence the y-domain.
  const allSeries = cfg.series;
  let dataT0 = Infinity, dataT1 = -Infinity;
  allSeries.forEach(function (ser) {
    ser.points.forEach(function (p) {
      if (p && isFinite(p.t)) {
        if (p.t < dataT0) dataT0 = p.t;
        if (p.t > dataT1) dataT1 = p.t;
      }
    });
  });
  if (!isFinite(dataT0)) {
    teardownChart(el, st);
    el.innerHTML = '<div class="chart-empty">' +
      (cfg.emptyMsg || 'waiting for more samples…') + '</div>';
    return false;
  }

  // Resolve the visible window from Live/Historical state.
  const win = viewportWindow(st, dataT0, dataT1);
  const vt0 = win[0], vt1 = win[1];

  // Keep null values (unavailable samples) so the renderer can draw an
  // explicit gap instead of connecting across missing data.
  const series = allSeries
    .filter(s => !st.hidden[s.name])
    .map(s => ({
      name: s.name, color: s.color,
      points: s.points.filter(p => p && p.t >= vt0 && p.t <= vt1),
    }));

  // Count only real values (nulls are gaps, not samples). One real sample
  // is enough to draw: isolated points render as dots (see renderChartInto),
  // so a genuine first reading is shown instead of the empty message.
  let finiteCount = 0;
  series.forEach(s => s.points.forEach(p => { if (p.v != null && isFinite(p.v)) finiteCount++; }));
  const finite = {length: finiteCount};
  if (finiteCount < 1) {
    teardownChart(el, st);
    el.innerHTML = '<div class="chart-empty">' +
      (cfg.emptyMsg || 'waiting for more samples…') + '</div>';
    return false;
  }

  // ---- geometry -----------------------------------------------------
  /*
   * Height SOURCE — must never be a measurement of this chart's own
   * subtree. Reading el.clientHeight and writing it back into the same
   * subtree is a feedback loop: the box/SVG heights feed the flex/grid
   * intrinsic sizes above them (.grid-fill has flex-basis:auto and 1fr
   * rows, so content height drives row height), which makes the container
   * taller on every pass, which makes the next read taller still. That was
   * the "charts grow on every refresh" regression.
   *
   * So the only heights written here are ones the layout cannot inflate:
   *   * an explicit cfg.height (callers that want a fixed plot), or
   *   * a viewport-proportional fallback for containers CSS does not size
   *     (e.g. a bare .chart div with no flex ancestry).
   *
   * For flex-filled cards (.card.fill) nothing is written at all: CSS sizes
   * the box (flex:1) and draw() reads the box's real pixel size each time
   * it paints. Rendering therefore measures the available space instead of
   * re-asserting a value derived from its own previous output.
   */
  const vh = (typeof window !== 'undefined' && window.innerHeight) || 800;
  const fallbackH = Math.round(Math.max(120, Math.min(260, (vh - 380) * 0.42)));
  const fixedH = cfg.height != null ? cfg.height : null;
  const PL_BASE = 8, PR = 10, PT = 8, PB = 18;

  // The x-domain is the *viewport*, so Live mode shows a trailing window of
  // exactly rangeMs and Historical mode holds its position even as new
  // samples arrive. Values outside the domain are simply not in `series`.
  let t0 = vt0, t1 = vt1;
  if (t1 <= t0) t1 = t0 + 1;
  let vmax = 0;
  series.forEach(function (ser) {
    ser.points.forEach(function (p) {
      if (p.v != null && isFinite(p.v) && p.v > vmax) vmax = p.v;
    });
  });
  const top = cfg.max != null ? cfg.max : niceCeil(vmax);

  // Gutter width depends on the axis labels, which depend on `top`.
  const labelW = measureLabelWidth(cfg, series, top);
  const PL = PL_BASE + labelW;

  // Build DOM once per element; subsequent mounts (live ticks) reuse it and
  // only redraw geometry. The box keeps its identity so pointer capture,
  // focus and hover listeners stay attached across updates.
  let box = el.querySelector(':scope > .chart-box');
  if (!box) {
    el.innerHTML = '';
    box = document.createElement('div');
    box.className = 'chart-box';
    el.appendChild(box);
  }
  // Only a caller-requested height is ever written. Derived heights are not
  // (see the geometry note above): writing a measured height here is what
  // made charts grow on every live refresh.
  if (fixedH != null) box.style.height = fixedH + 'px';

  const svgNS = 'http://www.w3.org/2000/svg';
  let svg = box.querySelector('svg');
  if (!svg) {
    svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('width', '100%');
    box.appendChild(svg);
  }
  // No height attribute: CSS (.chart svg{height:100%}) sizes the element to
  // the box, and an explicit attribute would re-introduce a second path by
  // which a rendered value could feed layout intrinsic sizes.

  /*
   * Draw from the box's REAL size. W/H are read at paint time, so the SVG
   * coordinate system always matches the pixels actually available and a
   * container resize (responsive breakpoint, window resize) is picked up by
   * the ResizeObserver below. Geometry is stashed on the state so hover and
   * pan handlers use the same numbers the painter used.
   */
  const draw = function () {
    const W = Math.max(120, box.clientWidth);
    const H = Math.max(60, Math.round(box.clientHeight || fallbackH));
    st.geo = {W: W, H: H};
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    renderChartInto(svg, {W: W, H: H, PL: PL, PR: PR, PT: PT, PB: PB,
                          t0: t0, t1: t1, top: top, series: series, cfg: cfg});
  };
  draw();

  // One ResizeObserver per chart; redraws coalesced into a rAF.
  if (!st.ro) {
    st.ro = new ResizeObserver(function () {
      if (st.rafPending) return;
      st.rafPending = true;
      requestAnimationFrame(function () { st.rafPending = false; draw(); });
    });
    st.ro.observe(box);
  }

  // Legend: click toggles a series on/off. Built once per element; ticks
  // only re-sync the off state (no listener churn).
  // NOTE: not '.chart-legend' — the toolbar also carries that class for the
  // shared focus rule, and matching it here would return the toolbar instead
  // of the legend.
  let lg = el.querySelector(':scope > .chart-legend:not(.chart-controls)');
  if (!lg) {
    lg = document.createElement('div');
    lg.className = 'chart-legend';
    el.appendChild(lg);
    cfg.series.forEach(function (s) {
      const item = document.createElement('span');
      item.className = 'lg-item';
      item.dataset.series = s.name;
      item.innerHTML = '<i style="background:' + s.color + '"></i>' + esc(s.name);
      item.tabIndex = 0;
      item.addEventListener('click', function () {
        st.hidden[s.name] = !st.hidden[s.name];
        mountChart(el, st.lastCfg);
      });
      item.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); item.click(); }
      });
      lg.appendChild(item);
    });
  }
  lg.querySelectorAll('.lg-item').forEach(function (item) {
    item.classList.toggle('off', !!st.hidden[item.dataset.series]);
  });

  /*
  /*
   * Controls row: [<< >>] [range buttons] [live badge / back-to-live].
   *
   * A range sets the window WIDTH. In Live mode the window keeps trailing
   * the newest sample; in Historical mode a new width is applied around the
   * current viewport's centre. Built once; ticks only sync button states.
   */
  const dataSpan = Math.max(1, dataT1 - dataT0);

  const enterLive = function () {
    st.live = true;
    st.anchor = null;
    mountChart(el, st.lastCfg);
  };

  let ctl = el.querySelector(':scope > .chart-controls');
  if (!ctl) {
    ctl = document.createElement('div');
    ctl.className = 'chart-legend chart-controls';

    const nav = document.createElement('span');
    nav.className = 'range-nav';
    const mkBtn = function (label, title, onClick) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'step-btn';
      b.textContent = label;
      b.title = title;
      b.setAttribute('aria-label', title);
      b.addEventListener('click', onClick);
      return b;
    };
    // Step backward / forward by a quarter of the current window width.
    const stepWin = function (dir) {
      const w = st.rangeMs != null ? st.rangeMs : dataSpan;
      const curEnd = st.live ? dataT1 : (st.anchor != null ? st.anchor : dataT1);
      let end = curEnd + dir * w * 0.25;
      end = Math.max(dataT0 + w * 0.25, Math.min(end, dataT1));
      st.live = false;
      st.anchor = end;
      mountChart(el, st.lastCfg);
    };
    nav.appendChild(mkBtn('\u25C0', 'Step back (Left arrow)', function () { stepWin(-1); }));
    nav.appendChild(mkBtn('\u25B6', 'Step forward (Right arrow)', function () {
      const w = st.rangeMs != null ? st.rangeMs : dataSpan;
      const curEnd = st.live ? dataT1 : (st.anchor != null ? st.anchor : dataT1);
      if (curEnd + w * 0.25 >= dataT1 - w * 0.05) { enterLive(); return; }
      stepWin(1);
    }));
    ctl.appendChild(nav);

    const rc = document.createElement('span');
    rc.className = 'range-ctrl';
    RANGES.forEach(function (r) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = r.label;
      b.dataset.range = r.ms == null ? '' : String(r.ms);
      b.addEventListener('click', function () {
        const oldW = st.rangeMs != null ? st.rangeMs : dataSpan;
        st.rangeMs = r.ms;
        saveRange(id, r.ms);
        if (!st.live && st.anchor != null) {
          // Historical: keep the viewport centred while the width changes.
          const w = r.ms != null ? r.ms : dataSpan;
          const centre = st.anchor - oldW / 2;
          st.anchor = Math.max(dataT0 + w * 0.5, Math.min(centre + w, dataT1));
        }
        mountChart(el, st.lastCfg);
      });
      rc.appendChild(b);
    });
    ctl.appendChild(rc);

    const lb = document.createElement('button');
    lb.type = 'button';
    lb.className = 'live-badge';
    lb.addEventListener('click', enterLive);
    ctl.appendChild(lb);

    const info = document.createElement('span');
    info.className = 'hist-note';
    ctl.appendChild(info);

    // Deterministic placement: the toolbar goes BEFORE the absolutely
    // positioned .chart-tip (which must stay last so it paints above the
    // plot), and AFTER the legend. Appending blindly put it after the tip,
    // which is invisible-but-present and made ordering depend on mount
    // timing across views.
    const tip = el.querySelector(':scope > .chart-tip');
    if (tip) el.insertBefore(ctl, tip); else el.appendChild(ctl);
  }

  // --- sync control states with current state (cheap, every tick) ---
  ctl.querySelectorAll('.range-ctrl button').forEach(function (b) {
    const ms = b.dataset.range === '' ? null : Number(b.dataset.range);
    // Hide fixed windows longer than collected history ("all" always shows).
    const tooLong = ms != null && dataSpan < ms * 0.5;
    b.style.display = tooLong ? 'none' : '';
    b.classList.toggle('on', (st.rangeMs || null) === ms);
  });

  const lbEl = ctl.querySelector('.live-badge');
  lbEl.className = 'live-badge' + (st.live ? ' on' : '');
  lbEl.textContent = st.live ? '\u25CF live' : 'back to live';
  lbEl.title = st.live ? 'Following the newest sample' : 'Return to live mode';
  lbEl.setAttribute('aria-pressed', st.live ? 'true' : 'false');
  lbEl.disabled = st.live;

  const noteEl = ctl.querySelector('.hist-note');
  if (!st.live) {
    noteEl.textContent = 'viewing ' + fmtClockShort(vt0) + '\u2013' + fmtClockShort(vt1) +
      (st.rangeMs != null && dataSpan < st.rangeMs
        ? ' \u00B7 showing ' + fmtDur(dataSpan) + ' of ' + fmtDur(st.rangeMs)
        : '');
    noteEl.style.display = '';
  } else {
    noteEl.style.display = 'none';
  }

  // Interaction handlers are attached ONCE per element (st.wired) and read
  // their geometry from st.geo / st.lastCfg at event time, so live ticks
  // never re-register listeners and never operate on stale dimensions.
  attachHover(el, box, svg, st, {PL: PL, PR: PR, PT: PT, PB: PB,
                                 t0: t0, t1: t1, top: top, series: series, cfg: cfg});
  // Data bounds for the pan handlers, refreshed on every mount.
  st.bounds = {dataT0: dataT0, dataT1: dataT1, t0: t0, t1: t1};
  attachPan(el, box, st, st.bounds);
  return true;
}

/*
 * Horizontal drag-pan. Pointer events + pointer capture so the gesture keeps
 * working outside the plot; text selection and page navigation are
 * suppressed only while dragging. Vertical wheel scrolling is never
 * captured — the page scrolls normally over charts.
 *
 * Listeners are registered once per element (st.wired.pan); every handler
 * resolves the current data bounds from st.lastCfg at event time, because
 * mountChart() runs on every live tick and would otherwise stack a fresh
 * set of listeners per refresh.
 */
function attachPan(el, box, st, g) {
  if (st.wired && st.wired.pan === box) return;
  st.wired = st.wired || {};
  st.wired.pan = box;
  let dragging = null;   // {startX, startEnd}

  box.style.touchAction = 'pan-y';   // vertical scroll stays native

  // Current data bounds; refreshed by every mountChart() call.
  const bounds = function () { return st.bounds || g; };

  box.addEventListener('pointerdown', function (ev) {
    if (ev.button !== 0) return;
    const b = bounds();
    const rect = box.getBoundingClientRect();
    const w = b.t1 - b.t0;
    const pxPerMs = w / Math.max(1, rect.width);
    dragging = {
      startX: ev.clientX,
      startEnd: st.live ? b.dataT1 : (st.anchor != null ? st.anchor : b.dataT1),
      pxPerMs: pxPerMs,
      moved: false,
    };
    // Pointer capture is best-effort: synthetic/untrusted pointer events
    // (tests, some automation) have no active pointer id and would throw.
    try { box.setPointerCapture(ev.pointerId); } catch (e) {}
    ev.preventDefault();          // no text selection during drag
  });

  box.addEventListener('pointermove', function (ev) {
    if (!dragging) return;
    const b = bounds();
    const dx = ev.clientX - dragging.startX;
    if (Math.abs(dx) > 3) dragging.moved = true;
    // Dragging right moves the window back in time.
    const end = dragging.startEnd - dx * dragging.pxPerMs;
    const span = Math.max(1, b.dataT1 - b.dataT0);
    const w = st.rangeMs != null ? Math.min(st.rangeMs, span) : span;
    const clamped = Math.max(b.dataT0 + w * 0.25, Math.min(end, b.dataT1));
    if (clamped !== st.anchor || st.live) {
      st.live = false;
      st.anchor = clamped;
      // Lightweight: update viewport state and redraw geometry only.
      mountChart(el, st.lastCfg);
    }
  });

  const finish = function (ev) {
    if (!dragging) return;
    try { box.releasePointerCapture(ev.pointerId); } catch (e) {}
    // A click without movement shouldn't leave live mode.
    if (!dragging.moved && st.anchor == null) st.live = true;
    dragging = null;
  };
  box.addEventListener('pointerup', finish);
  box.addEventListener('pointercancel', finish);

  // Keyboard: arrows step the window while the chart has focus.
  box.tabIndex = 0;
  box.setAttribute('role', 'img');
  box.setAttribute('aria-label', 'Time-series chart. Use left and right arrow keys to pan.');
  box.addEventListener('keydown', function (ev) {
    const b = bounds();
    const span = Math.max(1, b.dataT1 - b.dataT0);
    const w = st.rangeMs != null ? Math.min(st.rangeMs, span) : span;
    const curEnd = st.live ? b.dataT1 : (st.anchor != null ? st.anchor : b.dataT1);
    if (ev.key === 'ArrowLeft') {
      st.live = false;
      st.anchor = Math.max(b.dataT0 + w * 0.25, curEnd - w * 0.25);
      mountChart(el, st.lastCfg);
      ev.preventDefault();
    } else if (ev.key === 'ArrowRight') {
      const next = curEnd + w * 0.25;
      if (next >= b.dataT1 - w * 0.05) {
        st.live = true; st.anchor = null;
      } else {
        st.live = false; st.anchor = next;
      }
      mountChart(el, st.lastCfg);
      ev.preventDefault();
    }
  });
}

function teardownChart(el, st) {
  if (!st) return;
  if (st.ro) { try { st.ro.disconnect(); } catch (e) {} st.ro = null; }
  if (st.tip) { st.tip.remove(); st.tip = null; }
  st.wired = null;
  st.el = null;
}

/* The y-gutter is sized from the widest *axis label* so labels never clip.
 *
 * The axis top is a nice-rounded bound (niceCeil), which can be wider to
 * format than any data value — e.g. data peaking at 700 KB yields a top
 * gridline of "732 KB". Measuring only sample values (as an earlier version
 * did) intermittently under-sized the gutter and let the top label escape
 * the card. Measure exactly what will be drawn: the five gridline values.
 */
function measureLabelWidth(cfg, series, top) {
  const probe = document.createElement('canvas').getContext('2d');
  probe.font = '10px ui-monospace, Menlo, monospace';
  let w = 0;
  for (let i = 0; i <= 4; i++) {
    const v = top * i / 4;
    const txt = cfg.fmtY ? cfg.fmtY(v) : String(Math.round(v));
    const m = probe.measureText(txt).width;
    if (m > w) w = m;
  }
  return Math.min(80, Math.ceil(w) + 6);
}

/*
 * Chart drawing. The svg keeps a stable child structure across redraws
 * (grid group, plot group with one area+line pair per series, crosshair
 * group); redraws update attributes in place rather than rebuilding nodes,
 * which keeps live ticks cheap and avoids layout churn.
 */
function renderChartInto(svg, g) {
  const W = g.W, H = g.H, PL = g.PL, PR = g.PR, PT = g.PT, PB = g.PB;
  const t0 = g.t0, t1 = g.t1, top = g.top, series = g.series, cfg = g.cfg;
  const x = function (t) { return PL + (t - t0) / (t1 - t0) * (W - PL - PR); };
  const y = function (v) { return H - PB - (Math.max(0, Math.min(v, top)) / top) * (H - PT - PB); };

  const svgNS = 'http://www.w3.org/2000/svg';
  const mk = function (tag, attrs) {
    const n = document.createElementNS(svgNS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };

  // ---- ensure structure (first draw) --------------------------------
  if (!svg._built) {
    const gridG = mk('g', {});
    for (let i = 0; i <= 4; i++) {
      gridG.appendChild(mk('line', {stroke: '#212839', 'stroke-width': 1}));
      gridG.appendChild(mk('text', {'text-anchor': 'end', 'font-size': 10,
        fill: '#5c6779', 'font-family': 'ui-monospace,Menlo,monospace'}));
    }
    svg.appendChild(gridG);

    // Time labels: first / mid / last.
    ['start', 'middle', 'end'].forEach(function (anchor) {
      svg.appendChild(mk('text', {'text-anchor': anchor, 'font-size': 10,
        fill: '#5c6779', 'font-family': 'ui-monospace,Menlo,monospace'}));
    });

    const clipId = 'clip' + (++chartSeq);
    const defs = mk('defs', {});
    const clip = mk('clipPath', {id: clipId});
    clip.appendChild(mk('rect', {}));
    defs.appendChild(clip);
    svg.appendChild(defs);

    const plot = mk('g', {});
    plot.setAttribute('class', 'plot');
    plot.setAttribute('clip-path', 'url(#' + clipId + ')');
    svg.appendChild(plot);

    const cross = mk('g', {style: 'display:none', 'pointer-events': 'none'});
    const vline = mk('line', {y1: PT, y2: H - PB, stroke: '#3a465f',
      'stroke-width': 1, 'stroke-dasharray': '3 3'});
    cross.appendChild(vline);
    svg.appendChild(cross);

    svg._built = {gridG, plot, clipRect: clip.firstChild, cross, vline,
                  timeLabels: Array.prototype.slice.call(svg.querySelectorAll('text')).slice(0, 8).filter(t => !t.closest('.chart-tip')),
                  pairs: []};
  }
  const B = svg._built;

  // ---- update pass (cheap; runs every tick) ------------------------
  const gridKids = B.gridG.childNodes;
  for (let i = 0; i <= 4; i++) {
    const v = top * i / 4, yy = y(v);
    const ln = gridKids[i * 2];
    ln.setAttribute('x1', PL); ln.setAttribute('y1', yy);
    ln.setAttribute('x2', W - PR); ln.setAttribute('y2', yy);
    const tx = gridKids[i * 2 + 1];
    tx.setAttribute('x', PL - 6); tx.setAttribute('y', yy + 3.2);
    const label = cfg.fmtY ? cfg.fmtY(v) : String(Math.round(v));
    if (tx.textContent !== label) tx.textContent = label;
  }

  // Time labels (positions 5..7 of the text nodes we created).
  const timeTexts = [];
  for (let i = 0; i < svg.childNodes.length; i++) {
    const n = svg.childNodes[i];
    if (n.tagName === 'text') timeTexts.push(n);
  }
  if (timeTexts.length >= 3) {
    const setT = function (el, t, anchor) {
      el.setAttribute('x', x(t)); el.setAttribute('y', H - 5);
      el.setAttribute('text-anchor', anchor);
      const txt = fmtClockShort(t);
      if (el.textContent !== txt) el.textContent = txt;
    };
    setT(timeTexts[0], t0, 'start');
    setT(timeTexts[1], (t0 + t1) / 2, 'middle');
    setT(timeTexts[2], t1, 'end');
  }

  // Clip rect follows the plot area.
  B.clipRect.setAttribute('x', PL);
  B.clipRect.setAttribute('y', 0);
  B.clipRect.setAttribute('width', Math.max(0, W - PL - PR));
  B.clipRect.setAttribute('height', H - PB);

  // Warn band (created lazily, updated or hidden).
  let warnRect = B.warnRect, warnLine = B.warnLine;
  if ((cfg.warn != null && cfg.warn < top)) {
    if (!warnRect) {
      warnRect = mk('rect', {fill: '#ff6b7d', opacity: 0.05});
      warnLine = mk('line', {stroke: '#ff6b7d', 'stroke-width': 1,
                             'stroke-dasharray': '5 4', opacity: 0.45});
      B.plot.appendChild(warnRect);
      B.plot.appendChild(warnLine);
      B.warnRect = warnRect; B.warnLine = warnLine;
    }
    const wy = y(cfg.warn);
    warnRect.setAttribute('x', PL); warnRect.setAttribute('y', PT);
    warnRect.setAttribute('width', Math.max(0, W - PL - PR));
    warnRect.setAttribute('height', Math.max(0, wy - PT));
    warnLine.setAttribute('x1', PL); warnLine.setAttribute('y1', wy);
    warnLine.setAttribute('x2', W - PR); warnLine.setAttribute('y2', wy);
  } else {
    if (warnRect) { warnRect.setAttribute('width', 0); warnLine.setAttribute('width', 0);
                    warnLine.setAttribute('x1', 0); warnLine.setAttribute('x2', 0); }
  }

  // Series paths: one area+line pair per series, reused across draws.
  while (B.pairs.length < series.length) {
    const area = mk('path', {opacity: 0.07});
    const line = mk('path', {fill: 'none', 'stroke-width': 1.7,
                             'stroke-linejoin': 'round', 'stroke-linecap': 'round'});
    B.plot.appendChild(area); B.plot.appendChild(line);
    B.pairs.push({area, line});
  }
  for (let si = 0; si < B.pairs.length; si++) {
    const pair = B.pairs[si];
    if (si >= series.length) {          // extra pairs from a hidden series
      pair.area.style.display = 'none';
      pair.line.style.display = 'none';
      (pair.singles || []).forEach(dot => { dot.style.display = 'none'; });
      continue;
    }
    const ser = series[si];
    const pts = ser.points;
    // Build one subpath per contiguous run of valid samples: a null value
    // ends the run and the next valid sample starts a new one, so missing
    // data renders as a visible gap, never a bridged line.
    const runs = [];
    let cur = null;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      if (p.v == null || !isFinite(p.v)) { cur = null; continue; }
      if (!cur) { cur = []; runs.push(cur); }
      cur.push(p);
    }
    // Isolated points: genuine samples whose neighbours are gaps. They carry
    // real measurements, so they must be VISIBLE — rendered as dots rather
    // than skipped. Never fabricated, never interpolated across the gap.
    const singles = runs.filter(r => r.length === 1)
      .map(r => r[0]);
    if (!runs.length) {
      pair.area.style.display = 'none'; pair.line.style.display = 'none';
      pair.line.setAttribute('d', ''); pair.area.setAttribute('d', '');
    } else {
      pair.area.style.display = ''; pair.line.style.display = '';
    }
    let d = '';
    runs.forEach(function (run) {
      if (run.length < 2) return;   // single isolated point: drawn as a dot below
      d += (d ? ' ' : '') + 'M ' + x(run[0].t).toFixed(1) + ' ' + y(run[0].v).toFixed(1);
      for (let i = 1; i < run.length; i++) {
        d += ' L ' + x(run[i].t).toFixed(1) + ' ' + y(run[i].v).toFixed(1);
      }
    });
    pair.line.setAttribute('d', d);
    pair.line.setAttribute('stroke', ser.color);
    // One dot element per isolated point, reused across draws like the
    // line/area pairs (created lazily, hidden when not needed). Kept on the
    // pair so each series owns its own dots.
    pair.singles = pair.singles || [];
    while (pair.singles.length < singles.length) {
      pair.singles.push(mk('circle', {r: 2.5, 'stroke-width': 1,
                                      stroke: '#131722'}));
      B.plot.appendChild(pair.singles[pair.singles.length - 1]);
    }
    pair.singles.forEach(function (dot, di) {
      if (di < singles.length) {
        const p = singles[di];
        dot.setAttribute('cx', x(p.t).toFixed(1));
        dot.setAttribute('cy', y(p.v).toFixed(1));
        dot.setAttribute('fill', ser.color);
        dot.style.display = '';
      } else {
        dot.style.display = 'none';
      }
    });
    if (!cfg.noArea && d) {
      // Area under the last complete run only (a gap means no continuous
      // area — filling across it would imply data that isn't there).
      const run = runs[runs.length - 1];
      pair.area.setAttribute('d',
        'M ' + x(run[0].t).toFixed(1) + ' ' + y(run[0].v).toFixed(1) +
        run.slice(1).map(p => ' L ' + x(p.t).toFixed(1) + ' ' + y(p.v).toFixed(1)).join('') +
        ' L ' + x(run[run.length - 1].t).toFixed(1) + ' ' + (H - PB) +
        ' L ' + x(run[0].t).toFixed(1) + ' ' + (H - PB) + ' Z');
      pair.area.setAttribute('fill', ser.color);
    } else {
      pair.area.setAttribute('d', '');
    }
  }

  // Crosshair: keep group; sync dot count with visible series.
  while (B.cross.childNodes.length - 1 < series.length) {
    B.cross.appendChild(mk('circle', {r: 3, stroke: '#0a0c10', 'stroke-width': 1.5}));
  }
  const dots = Array.prototype.slice.call(B.cross.childNodes).slice(1);
  dots.forEach(function (dot, i) {
    if (i < series.length) {
      dot.setAttribute('fill', series[i].color);
      dot.style.display = '';
    } else {
      dot.style.display = 'none';
    }
  });
  B.vline.setAttribute('y1', PT); B.vline.setAttribute('y2', H - PB);
  svg._cross = {group: B.cross, vline: B.vline, dots: dots};
}

/* Compact duration for range notes: "7m", "1h 5m". */
function fmtDur(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  return h + 'h ' + (m % 60) + 'm';
}

function fmtClockShort(ms) {
  const d = new Date(ms);
  const p = function (n) { return String(n).padStart(2, '0'); };
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

/* Hover crosshair + tooltip with per-series values at the nearest sample.
 *
 * Registered once per element (st.wired.hover); each move resolves the
 * current plot geometry from st.view (refreshed by every mountChart) so the
 * crosshair tracks the live viewport/window even after many refreshes.
 */
function attachHover(el, box, svg, st, g) {
  if (!st.tip) {
    st.tip = document.createElement('div');
    st.tip.className = 'chart-tip';
    el.appendChild(st.tip);
  }
  const tip = st.tip;
  // Latest plot description; mountChart() overwrites this every tick.
  st.view = {PL: g.PL, PR: g.PR, PT: g.PT, PB: g.PB,
             t0: g.t0, t1: g.t1, top: g.top, series: g.series, cfg: g.cfg};
  if (st.wired && st.wired.hover === box) return;
  st.wired = st.wired || {};
  st.wired.hover = box;

  const hide = function () {
    tip.style.display = 'none';
    if (svg._cross) svg._cross.group.style.display = 'none';
  };

  const move = function (ev) {
    // Resolve the CURRENT plot geometry: the window, series and pixel height
    // all change as live samples arrive or the container resizes.
    const v = st.view || {};
    const PL = v.PL, PR = v.PR, PT = v.PT, PB = v.PB;
    const t0 = v.t0, t1 = v.t1, top = v.top, series = v.series, cfg = v.cfg;
    const H = (st.geo && st.geo.H) || Math.round(box.clientHeight);
    if (PL == null || !series) return;

    const rect = box.getBoundingClientRect();
    const px = ev.clientX - rect.left;
    if (px < PL - 4 || px > rect.width - PR + 4) { hide(); return; }
    const frac = Math.max(0, Math.min(1, (px - PL) / (rect.width - PL - PR)));
    const tt = t0 + frac * (t1 - t0);

    // Nearest timestamp across all visible series.
    let bestT = null, bestD = Infinity;
    series.forEach(function (s) {
      s.points.forEach(function (p) {
        const d = Math.abs(p.t - tt);
        if (d < bestD) { bestD = d; bestT = p.t; }
      });
    });
    if (bestT == null) { hide(); return; }

    const cross = svg._cross;
    let rows = [];
    if (cross) {
      cross.group.style.display = '';
      const cx = PL + (bestT - t0) / (t1 - t0) * (rect.width - PL - PR);
      cross.vline.setAttribute('x1', cx);
      cross.vline.setAttribute('x2', cx);
      for (let i = 0; i < series.length; i++) {
        const s = series[i];
        // Nearest point of this series to bestT.
        let bp = s.points[0];
        for (let j = 1; j < s.points.length; j++) {
          if (Math.abs(s.points[j].t - bestT) < Math.abs(bp.t - bestT)) bp = s.points[j];
        }
        const dot = cross.dots[i];
        dot.setAttribute('cx', cx);
        dot.setAttribute('cy', H - PB - (Math.max(0, Math.min(bp.v, top)) / top) * (H - PT - PB));
        dot._pt = bp;
        const val = cfg.fmtVal ? cfg.fmtVal(bp.v) : (cfg.fmtY ? cfg.fmtY(bp.v) : bp.v.toFixed(1));
        rows.push('<div class="r"><i style="background:' + s.color + '"></i>' + esc(s.name) +
                  '<b>' + esc(val) + '</b></div>');
      }
    }

    tip.innerHTML = '<div class="t">' + fmtClockShort(bestT) + '</div>' + rows.join('');
    tip.style.display = 'block';

    // Keep the tooltip inside the card: flip near the right edge.
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let lx = px + 14;
    if (lx + tw > rect.width - 4) lx = px - tw - 14;
    if (lx < 2) lx = 2;
    let ly = PT + Math.max(0, Math.min(rect.height - th - 2, (H - PT - PB) / 2 - th / 2));
    tip.style.left = lx + 'px';
    tip.style.top = ly + 'px';
  };

  box.addEventListener('mousemove', move);
  box.addEventListener('mouseleave', hide);
}

/**
 * Drop state for charts that are no longer mounted (view switched away).
 * Keeps the CHARTS map bounded and disconnects ResizeObservers so detached
 * elements don't leak or keep firing.
 */
function pruneCharts() {
  const live = new Set();
  document.querySelectorAll('[data-chart]').forEach(el => {
    live.add(el.dataset.chart);
  });
  Array.from(CHARTS.keys()).forEach(key => {
    if (!live.has(key)) {
      const st = CHARTS.get(key);
      if (st.ro) { try { st.ro.disconnect(); } catch (e) {} }
      if (st.tip) { try { st.tip.remove(); } catch (e) {} }
      CHARTS.delete(key);
    }
  });
}

/** Mount every [data-chart] placeholder in `root` using `registry`. */
function mountChartsIn(root, registry) {
  const nodes = (root || document).querySelectorAll('[data-chart]');
  nodes.forEach(function (el) {
    const cfg = registry[el.dataset.chart];
    if (cfg) mountChart(el, cfg);
  });
}

/**
 * Markup for a chart container; views embed this and declare their config in
 * a #chartRegistry JSON block, which render() passes to mountChartsIn().
 */
function chartPlaceholder(key) {
  return '<div class="chart" data-chart="' + esc(key) + '"></div>';
}

/* ================================================================
   Data access
   ================================================================ */
async function jget(url) {
  const r = await fetch(url, {cache: 'no-store'});
  // Session expired: re-authenticate, preserving this deep link.
  if (r.status === 401) {
    const next = encodeURIComponent(location.pathname + location.hash);
    location.replace('/signin?next=' + next);
    throw new Error('authentication required');
  }
  if (!r.ok) {
    const t = await r.text().catch(() => '');
    throw new Error(r.status + ': ' + t.slice(0, 160));
  }
  return r.json();
}

/* ---------- session chip (shared shell) ----------
 * Shows the signed-in owner and offers sign-out; hidden when auth is not
 * configured for this instance. */
async function initSessionChip() {
  const chip = document.getElementById('userChip');
  if (!chip) return;
  try {
    const st = await fetch('/api/auth/status').then(r => r.json());
    if (!st.signedIn) { chip.hidden = true; return; }
    chip.hidden = false;
    const name = String(st.identifier || 'owner');
    document.getElementById('userName').textContent = name;
    document.getElementById('userAvatar').textContent =
      name.trim().charAt(0).toUpperCase() || '·';
    const btn = document.getElementById('signOutBtn');
    if (btn) btn.onclick = async () => {
      btn.disabled = true;
      try { await fetch('/api/auth/signout', { method: 'POST' }); } catch {}
      location.replace('/signin');
    };
  } catch { chip.hidden = true; }
}

/* History point arrays, tolerating null values (dropped windows). */
/*
 * History points for one series. NaN values are KEPT as nulls so charts can
 * draw an honest gap where a metric was unavailable — dropping them would
 * fabricate continuity across the gap.
 *
 * `since` (optional) clips to the visible window before any further work:
 * with a 1-minute range over an hour of history this avoids walking ~97% of
 * the buffer on every tick.
 */
function histPoints(key, since) {
  const h = S.history && S.history[key];
  if (!Array.isArray(h)) return [];
  const out = [];
  for (let i = 0; i < h.length; i++) {
    const p = h[i];
    if (!p) continue;
    if (since != null && p.t < since) continue;
    // NaN → null: an explicit "no value here" marker.
    out.push({t: p.t, v: isFinite(p.v) ? p.v : null});
  }
  return out;
}
function histSeries() {
  return {
    cpu: [
      {name:'total',  color:'#4ecdc4', points: histPoints('cpuPercent')},
      {name:'user',   color:'#64a8ff', points: histPoints('cpuUserPercent')},
      {name:'system', color:'#f5b841', points: histPoints('cpuSystemPercent')},
    ],
    mem: [
      {name:'used',      color:'#a78bfa', points: histPoints('memoryUsedBytes')},
      {name:'swap used', color:'#ff6b7d', points: histPoints('swapUsedBytes')},
    ],
    disk: [
      {name:'read/s',  color:'#4ecdc4', points: histPoints('diskReadPerSec')},
      {name:'write/s', color:'#f5b841', points: histPoints('diskWritePerSec')},
    ],
    net: [
      {name:'download', color:'#64a8ff', points: histPoints('netRecvPerSec')},
      {name:'upload',   color:'#4ecdc4', points: histPoints('netSentPerSec')},
    ],
    gpu: [
      {name:'utilization', color:'#f5b841', points: histPoints('gpuUtilPercent')},
    ],
    batt: [
      {name:'charge', color:'#4ecdc4', points: histPoints('batteryChargePercent')},
    ],
  };
}

/* ================================================================
   Refresh cycle (overlap-guarded)
   ================================================================ */
/*
 * Refresh with retry backoff.
 *
 * Consecutive failures double the effective wait (capped at 15 s) so a dead
 * backend isn't hammered at the poll rate; any success resets it. Errors are
 * non-blocking: existing data and chart state are kept, a banner explains,
 * and polling continues.
 */
let failStreak = 0;
function nextDelayMs() {
  const base = Math.max(1200, (S.overview && S.overview.intervalMs) || 2000);
  if (failStreak === 0) return base;
  return Math.min(15000, base * Math.pow(2, Math.min(failStreak, 4)));
}

/* ================================================================
   Staleness & system health
   ================================================================ */
/*
 * Data is STALE when the newest sample we hold is meaningfully older than
 * the sampling interval — either because refreshes are failing or because
 * the backend sampler itself stalled. Stale values stay visible (better
 * than a blank dashboard) but are always labeled as such, never presented
 * as current. Threshold: 3× the expected cadence, floor 5 s.
 */
function stalenessMs() {
  if (!S.overview || !S.overview.sampledAtMs) return null;
  const age = Date.now() - S.overview.sampledAtMs;
  const expect = Math.max((S.overview && S.overview.intervalMs) || 2000, 500);
  const threshold = Math.max(5000, expect * 3);
  return age > threshold ? age : null;
}

/*
 * Honest aggregate health for the strip:
 *   error    — refreshes are failing (data may be entirely absent)
 *   stale    — we hold data, but it is older than the staleness threshold
 *   warn     — live, but some core domains report unavailable metrics
 *   ok       — live and fresh
 * A single green dot is only shown when refreshes succeed AND the newest
 * sample is fresh; missing/stale critical data downgrades it visibly.
 */
function healthState() {
  if (S.error && !S.overview) return {cls: 'err', label: 'Connection error',
    detail: 'metrics unreachable — ' + (S.error || '').slice(0, 120)};
  if (S.error) return {cls: 'err', label: 'Refresh failing',
    detail: 'showing last good data · ' + (S.error || '').slice(0, 100)};
  const st = stalenessMs();
  if (st != null) return {cls: 'warn', label: 'Data stale',
    detail: 'last sample ' + ago(S.overview.sampledAtMs) + ' — values below may not be current'};
  if (!S.overview) return {cls: 'warn', label: 'Connecting…', detail: 'waiting for first sample'};
  // Live: mention honestly when core domains are unavailable on this machine.
  const g = S.snapshot && S.snapshot.gpu, b = S.snapshot && S.snapshot.battery;
  const gaps = [];
  if (g && !(g.utilizationPercent && g.utilizationPercent.available)) gaps.push('GPU');
  if (b && !(b.chargePercent && b.chargePercent.available)) gaps.push('battery');
  return {cls: 'ok', label: 'Live · local',
    detail: gaps.length ? 'no ' + gaps.join(' / ') + ' telemetry on this device' : 'all sampled domains reporting'};
}

/* The health strip markup, shown above every system view. */
function healthStripHtml() {
  const h = healthState();
  const host = S.snapshot && S.snapshot.host;
  const who = [host && host.hostName, host && host.osName, host && host.osVersion]
    .filter(Boolean).join(' · ');
  return '<div class="health-strip" id="healthStrip">' +
    '<span class="health-dot ' + h.cls + '" aria-hidden="true"></span>' +
    '<span class="health-title">' + esc(h.label) + '</span>' +
    '<span class="health-detail">' + esc(h.detail) + '</span>' +
    '<span class="health-spacer"></span>' +
    (who ? '<span class="health-detail mono">' + esc(who) + '</span>' : '') +
    '</div>';
}

async function refresh() {
  if (S.inFlight) return;
  S.inFlight = true;
  try {
    const results = await Promise.all([
      jget('/api/sys/overview'),
      jget('/api/sys/snapshot'),
      jget('/api/sys/history'),
    ]);
    S.overview = results[0];
    S.snapshot = results[1];
    // History endpoint wraps the series in {demo, history:{…}}.
    S.history  = (results[2] && results[2].history) || {};
    S.demo     = !!results[0].demo;
    S.error    = null;
    S.lastFetch = Date.now();
    failStreak = 0;
    $('footStatus').textContent = S.demo ? 'demo data' : 'live · local';
    $('liveDot').classList.remove('err');
    scheduleTimers();
  } catch (e) {
    S.error = e.message || String(e);
    failStreak++;
    $('footStatus').textContent = 'connection error';
    $('liveDot').classList.add('err');
    // Re-schedule with backoff; never lose the loop entirely.
    scheduleTimers(true);
  } finally {
    S.inFlight = false;
  }
  updateLive();
}

async function refreshProcesses() {
  if (S.view !== 'processes' || S.inFlight) return;
  S.inFlight = true;
  try {
    const q = new URLSearchParams({
      q: S.procQuery, sort: S.procSort, dir: S.procDir, limit: S.procLimit,
    });
    S.procData = await jget('/api/sys/processes?' + q);
  } catch (e) {
    S.error = e.message || String(e);
  } finally {
    S.inFlight = false;
  }
  render();   // process rows change structure (sorting/filtering); rebuild is correct here
}

/*
 * The single metrics timer. Normally follows the server-side sampling
 * interval; after failures it stretches with backoff. Exactly one interval
 * is ever active — the guard prevents duplicates across remounts/hot reload.
 */
let currentIntervalMs = 0;
function scheduleTimers(force) {
  const pollMs = nextDelayMs();
  if (!force && pollMs === currentIntervalMs && S.timerId != null) return;
  currentIntervalMs = pollMs;
  if (S.timerId != null) clearInterval(S.timerId);
  S.timerId = setInterval(refresh, pollMs);
}

/* ================================================================
   Partial renderers (return HTML strings)
   ================================================================ */
/* Tiny trend line for KPI cards. Pure function of the point list; caps the
 * number of samples it walks so a long history stays cheap. */
function sparklineSvg(points, color) {
  if (!points || points.length < 2) {
    return '<svg class="spark" aria-hidden="true"></svg>';
  }
  const step = Math.max(1, Math.floor(points.length / 60));
  const pts = [];
  for (let i = 0; i < points.length; i += step) pts.push(points[i]);
  if (pts[pts.length - 1] !== points[points.length - 1]) pts.push(points[points.length - 1]);
  // Gapped series (nulls from unavailable samples) must not produce NaN
  // coordinates: keep only finite values; a sparkline with fewer than two
  // real samples is honestly empty rather than drawn across the gap.
  const valid = pts.filter(p => p && p.v != null && isFinite(p.v));
  if (valid.length < 2) {
    return '<svg class="spark" aria-hidden="true"></svg>';
  }
  let lo = Infinity, hi = -Infinity;
  valid.forEach(function (p) {
    if (!isFinite(p.v)) return;
    if (p.v < lo) lo = p.v;
    if (p.v > hi) hi = p.v;
  });
  if (!isFinite(lo) || !isFinite(hi)) return '<svg class="spark" aria-hidden="true"></svg>';
  const span = hi - lo || 1;
  const W = 100, H = 14;
  let d = '';
  valid.forEach(function (p, i) {
    const x = (i / (valid.length - 1)) * W;
    const y = H - 2 - ((p.v - lo) / span) * (H - 4);
    d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1);
  });
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
         '<path d="' + d + '" stroke="' + (color || 'var(--ink-faint)') + '"/></svg>';
}

/* Severity color for a 0-100 percentage: normal → warm → hot. */
function sevColor(pct) {
  if (pct == null || !isFinite(pct)) return 'var(--acc)';
  if (pct >= 90) return 'var(--red)';
  if (pct >= 75) return 'var(--amber)';
  return 'var(--acc)';
}

/*
 * KPI card. `live` (optional) names the metric for incremental updates:
 * {key, value(), sub(), bar()} — updateLive() re-invokes these each tick and
 * patches the DOM in place instead of rebuilding the card.
 */
function kpiCard(label, valueHtml, subHtml, tipText, barPct, barColor, unavail, live) {
  const bar = (barPct != null)
    ? '<div class="bar"><i data-bar="' + (live ? live.key : '') + '" style="width:' +
      Math.min(100, Math.max(0, barPct)) +
      '%;background:' + (barColor || sevColor(barPct)) + '"></i></div>'
    : '';
  let extra = bar;
  if (bar === '' && live && live.spark) {
    // No utilization bar for this metric — draw a small trend instead.
    extra = sparklineSvg(live.spark(), live.sparkColor);
  }
  return '<div class="kpi' + (unavail ? ' unavail' : '') + '">' +
    '<div class="kpi-label" ' + tip(tipText || label) + '>' + esc(label) + '<span>ⓘ</span></div>' +
    '<div class="kpi-value"' + (live ? ' data-live="' + live.key + '"' : '') + '>' + valueHtml + '</div>' +
    '<div class="kpi-sub"' + (live && live.sub ? ' data-live="' + live.key + ':sub"' : '') + '>' +
      (subHtml || '') + '</div>' + extra + '</div>';
}

function metricCard(label, m, fmt, subFn) {
  const v = mval(m, fmt);
  if (v == null) {
    return kpiCard(label, 'Unavailable',
      esc((m && m.unavailableReason) || 'not supported'),
      (m && m.description) || label, null, null, true);
  }
  return kpiCard(label, esc(v), subFn ? subFn() : '', (m && m.description) || label,
    null, null, false);
}

function coreGrid(cores) {
  if (!cores || !cores.length) {
    return '<div class="empty-msg">per-core readings appear after the second sample</div>';
  }
  return '<div class="core-grid">' + cores.map(c => {
    const heat = Math.min(1, Math.max(0, c.totalPercent / 100));
    const a = (0.05 + 0.45 * heat).toFixed(3);
    const b = (0.12 + 0.5 * heat).toFixed(3);
    return '<div class="core" style="background:rgba(78,205,196,' + a +
      ');border-color:rgba(78,205,196,' + b + ')">' +
      '<div class="core-id">core ' + c.index + '</div>' +
      '<div class="core-pct">' + c.totalPercent.toFixed(0) + '%</div></div>';
  }).join('') + '</div>';
}

function volumeRows(vols) {
  if (!vols || !vols.length) return '<div class="empty-msg">no volumes reported</div>';
  return '<div class="row-list">' + vols.map(v => {
    const used = v.totalBytes - v.availableBytes;
    const pct = v.totalBytes ? (100 * used / v.totalBytes) : 0;
    const col = pct > 90 ? 'var(--red)' : pct > 75 ? 'var(--amber)' : 'var(--acc)';
    return '<div class="list-row">' +
      '<div style="min-width:120px"><div class="vol-name">' + esc(v.name) + '</div>' +
      '<div class="vol-mount">' + esc(v.mountPoint) + ' · ' + esc(v.fileSystem) +
      (v.removable ? ' · removable' : '') + '</div></div>' +
      '<div class="vol-bar"><i style="width:' + Math.min(100, pct) + '%;background:' + col + '"></i></div>' +
      '<div class="vol-size">' + fmtBytes(used, 1) + ' used<br><span class="muted">' +
      fmtBytes(v.availableBytes, 1) + ' free of ' + fmtBytes(v.totalBytes, 0) + '</span></div>' +
      '</div>';
  }).join('') + '</div>';
}

function ifaceRows(ifaces) {
  if (!ifaces || !ifaces.length) return '<div class="empty-msg">no interfaces reported</div>';
  const sorted = ifaces.slice().sort((a, b) =>
    (b.receivedPerSec + b.transmittedPerSec) - (a.receivedPerSec + a.transmittedPerSec));
  return '<div class="row-list">' + sorted.map(i =>
    '<div class="iface-row">' +
    '<span>' + esc(i.name) + ' ' + (i.active
      ? '<span class="chip ok">active</span>'
      : '<span class="chip na">idle</span>') + '</span>' +
    '<span class="dim">↓ ' + fmtRate(i.receivedPerSec) + ' · ↑ ' + fmtRate(i.transmittedPerSec) + '</span>' +
    '<span class="muted">Σ ↓' + fmtBytes(i.totalReceived, 0) + ' ↑' + fmtBytes(i.totalTransmitted, 0) + '</span>' +
    '</div>').join('') + '</div>';
}

function metricLine(label, m, fmt) {
  const v = mval(m, fmt);
  return '<div class="iface-row"><span>' + esc(label) + '</span>' +
    (v != null
      ? '<span class="acc">' + esc(v) + '</span>'
      : '<span class="chip na" ' + tip((m && m.unavailableReason) || '') + '">unavailable</span>') +
    '</div>';
}

/* ================================================================
   View renderers
   ================================================================ */
/* ================================================================
   AI System Overview (deterministic, metrics-based)
   ----------------------------------------------------------------
 * A compact assessment card at the top of the System Dashboard.
 * Rules, not a model: every verdict below is computed from the same
 * /api/sys payloads the KPI cards use, with fixed public thresholds.
 * Nothing is invented — unavailable domains render as Unavailable with
 * their reason, and stale data downgrades the verdict visibly.
 * Re-evaluated on each poll by the overview live-updater; no LLM call,
 * no new provider, no credentials.
 * ================================================================ */

/* Public thresholds (percent / bytes). Interpretations cite them so the
 * card can explain itself without hiding the math. */
const AI_THRESHOLDS = {
  cpu:  { warn: 70, crit: 90 },          // sustained busy %
  mem:  { warn: 80, crit: 92 },          // used % of physical RAM
  gpu:  { warn: 80, crit: 95 },          // device utilization %
  swap: { warnBytes: 512 * 1024 * 1024 },// swap in use worth mentioning
  batt: { low: 20 },                     // charge %
};

/* Level → badge class + label. */
const AI_LEVELS = {
  ok:    { cls: 'ok',    label: 'Healthy' },
  warn:  { cls: 'warn',  label: 'Warning' },
  crit:  { cls: 'crit',  label: 'Critical' },
  unknown: { cls: 'unknown', label: 'Unknown' },
};

/* Deterministic read of one domain. Returns {level, text} or null when the
 * domain has no reading at all (rendered as Unavailable upstream). */
function aiReadCpu(o) {
  if (o.cpuPercent == null || !isFinite(o.cpuPercent)) return null;
  const t = AI_THRESHOLDS.cpu;
  const la = S.snapshot && S.snapshot.cpu && S.snapshot.cpu.loadAverage;
  let level = o.cpuPercent >= t.crit ? 'crit' : o.cpuPercent >= t.warn ? 'warn' : 'ok';
  let text = fmtPct(o.cpuPercent, 0) + ' busy';
  if (la && la.one != null) text += ' · load ' + la.one.toFixed(2);
  if (level === 'crit') text += ' — near saturation (' + t.crit + '%+)';
  else if (level === 'warn') text += ' — elevated (' + t.warn + '%+)';
  else text += ' — comfortable headroom';
  return { level, text };
}

function aiReadMemory(o) {
  if (!o.memoryTotalBytes || o.memoryUsedBytes == null) return null;
  const pct = 100 * o.memoryUsedBytes / o.memoryTotalBytes;
  const t = AI_THRESHOLDS.mem;
  let level = pct >= t.crit ? 'crit' : pct >= t.warn ? 'warn' : 'ok';
  let text = fmtPct(pct, 0) + ' of ' + fmtBytes(o.memoryTotalBytes, 0) + ' in use';
  if (o.swapUsedBytes != null && o.swapUsedBytes >= AI_THRESHOLDS.swap.warnBytes) {
    if (level === 'ok') level = 'warn';
    text += ' · swapping ' + fmtBytes(o.swapUsedBytes, 1);
  }
  if (level === 'crit') text += ' — memory pressure likely (' + t.crit + '%+)';
  else if (level === 'warn') text += ' — filling up (' + t.warn + '%+)';
  else text += ' — healthy';
  return { level, text };
}

function aiReadGpu(snap) {
  const g = snap && snap.gpu;
  if (!g) return null;
  const u = mval(g.utilizationPercent);
  if (u == null) return null;
  const t = AI_THRESHOLDS.gpu;
  const level = u >= t.crit ? 'crit' : u >= t.warn ? 'warn' : 'ok';
  let text = fmtPct(u, 0) + ' utilization';
  const gm = mval(g.memoryUsedBytes);
  if (gm != null) text += ' · ' + fmtBytes(gm, 1) + ' GPU memory';
  const temp = mval(g.temperatureCelsius);
  if (temp != null) text += ' · ' + Math.round(temp) + '°C';
  // Only surface thermal pressure when it actually reports pressure —
  // nominal readings (any casing/annotation) stay quiet.
  const tp = mval(g.thermalPressure);
  if (tp && !/nominal|ok|normal/i.test(tp)) text += ' · thermal: ' + esc(tp);
  if (level === 'warn') text += ' — heavy load (' + t.warn + '%+)';
  else if (level === 'crit') text += ' — saturated (' + t.crit + '%+)';
  return { level, text };
}

function aiReadBattery(snap) {
  const b = snap && snap.battery;
  if (!b) return null;
  const charge = mval(b.chargePercent);
  if (charge == null) return null;
  const status = mval(b.status) || '';
  const mins = mval(b.timeRemainingMinutes);
  let level = 'ok', text = fmtPct(charge, 0) + (status ? ' · ' + esc(status) : '');
  if (mins != null) text += ' · ' + mins + ' min left';
  if (charge < AI_THRESHOLDS.batt.low && !/charg/i.test(status)) {
    level = 'warn';
    text += ' — low, plug in soon';
  }
  return { level, text };
}

/* Aggregate verdict: worst live domain wins; stale/error data is Unknown. */
function aiVerdict(reads, stale, error) {
  if (error && !reads.length) return AI_LEVELS.unknown;
  if (stale != null) return AI_LEVELS.unknown;
  let worst = 'ok';
  for (const r of reads) {
    if (!r) continue;
    if (r.level === 'crit') { worst = 'crit'; break; }
    if (r.level === 'warn') worst = 'warn';
  }
  return AI_LEVELS[worst];
}

/* Actionable recommendations — only from readings that actually fired. */
function aiRecommendations(reads) {
  const out = [];
  const byLevel = lvl => reads.filter(r => r && r.level === lvl);
  for (const r of byLevel('crit')) out.push({ sev: 'crit', text: r.text });
  for (const r of byLevel('warn')) out.push({ sev: 'warn', text: r.text });
  return out.slice(0, 4);
}

/* The card. Compact: verdict + per-domain rows + recommendations +
 * last-updated stamp. All rows carry data-live keys so updateLive patches
 * them in place without rebuilding the card. */
function aiOverviewCard() {
  const o = S.overview, snap = S.snapshot;
  if (!o) return '';   // nothing yet: the loading message covers it
  const stale = stalenessMs();
  const reads = {
    cpu: aiReadCpu(o),
    mem: aiReadMemory(o),
    gpu: aiReadGpu(snap),
    batt: aiReadBattery(snap),
  };
  const v = aiVerdict(Object.values(reads), stale, S.error);

  const row = (icon, name, r, unavailText) => {
    const dot = r ? '<span class="ai-dot ' + r.level + '"></span>' :
      '<span class="ai-dot na"></span>';
    const body = r
      ? '<span class="ai-row-text" data-live="ai:' + name + '">' + r.text + '</span>'
      : '<span class="ai-row-text dim">Unavailable' +
          (unavailText ? ' — ' + esc(unavailText) : '') + '</span>';
    return '<div class="ai-row">' + dot +
      '<span class="ai-row-name">' + icon + ' ' + name.toUpperCase() + '</span>' + body + '</div>';
  };

  const g = snap && snap.gpu, b = snap && snap.battery;
  const gpuReason = g && g.utilizationPercent && g.utilizationPercent.unavailableReason;
  const battReason = b && b.chargePercent && b.chargePercent.unavailableReason;

  let rows = row('⚙', 'cpu', reads.cpu, 'no CPU telemetry');
  rows += row('▤', 'memory', reads.mem, 'no memory telemetry');
  rows += row('◫', 'gpu', reads.gpu, gpuReason || 'not supported on this device');
  rows += row('⌁', 'battery', reads.batt, battReason || 'no battery on this device');

  const recs = aiRecommendations(Object.values(reads));
  const recHtml = recs.length
    ? '<div class="ai-recs">' + recs.map(r =>
        '<div class="ai-rec ' + r.sev + '">▸ ' + esc(r.text) + '</div>').join('') + '</div>'
    : '<div class="ai-recs"><div class="ai-rec ok">▸ No action needed — all sampled domains within thresholds.</div></div>';

  const stamp = o.sampledAtMs
    ? '<span class="ai-stamp" data-live="ai:stamp">updated ' + ago(o.sampledAtMs) +
      ' · sample #' + o.sampleCount + '</span>'
    : '';

  return '<div class="card ai-card" id="aiOverview">' +
    '<div class="ai-head">' +
      '<div><h3>AI System Overview</h3>' +
      '<div class="hint">deterministic assessment from live local metrics — fixed thresholds, no model calls</div></div>' +
      '<span class="ai-verdict ' + v.cls + '" data-live="ai:verdict">' +
        '<span class="ai-dot ' + v.cls + '"></span>' + v.label + '</span>' +
    '</div>' +
    '<div class="ai-rows">' + rows + '</div>' +
    recHtml +
    '<div class="ai-foot">' + stamp +
      '<span class="ai-thresholds">thresholds — cpu ' + AI_THRESHOLDS.cpu.warn + '/' + AI_THRESHOLDS.cpu.crit +
      '% · mem ' + AI_THRESHOLDS.mem.warn + '/' + AI_THRESHOLDS.mem.crit +
      '% · gpu ' + AI_THRESHOLDS.gpu.warn + '/' + AI_THRESHOLDS.gpu.crit + '%</span>' +
    '</div>' +
  '</div>';
}

function viewOverview() {
  const o = S.overview, snap = S.snapshot;
  if (!o) return '<div class="loading-msg">waiting for metrics…</div>';
  const hs = histSeries();

  const memPct = o.memoryTotalBytes ? 100 * o.memoryUsedBytes / o.memoryTotalBytes : 0;
  const up = snap ? fmtUptime(snap.uptimeSecs) : null;
  const la = snap && snap.cpu && snap.cpu.loadAverage;

  let cards = '';
  cards += kpiCard('CPU', fmtPct(o.cpuPercent),
    'user ' + fmtPct(o.cpuUserPercent, 0) + ' · sys ' + fmtPct(o.cpuSystemPercent, 0),
    'Aggregate busy percentage across all logical cores (Mach tick deltas)',
    o.cpuPercent, null, false,
    {key: 'ovCpu', sub: true});
  cards += kpiCard('MEMORY', fmtBytes(o.memoryUsedBytes, 1),
    'of ' + fmtBytes(o.memoryTotalBytes, 0) + ' · swap ' +
      (o.swapUsedBytes != null ? fmtBytes(o.swapUsedBytes, 1) : 'n/a'),
    'macOS "used" = wired + compressed + app memory; file cache is reclaimable and excluded',
    memPct, 'var(--violet)', false,
    {key: 'ovMem', sub: true});
  // Headlines carry both directions so a lone number is never ambiguous.
  cards += kpiCard('DISK I/O',
    'R ' + (o.diskReadPerSec != null ? fmtRate(o.diskReadPerSec) : '…') +
    ' · W ' + (o.diskWritePerSec != null ? fmtRate(o.diskWritePerSec) : '…'),
    (o.diskReadPerSec == null && o.diskWritePerSec == null)
      ? 'first sample seeds counters' : 'across all volumes',
    'Read/write throughput across volumes over the last sampling window',
    null, null, false,
    {key: 'ovDisk', spark: () => histPoints('diskWritePerSec'), sparkColor: 'var(--amber)'});
  cards += kpiCard('NETWORK',
    '\u2193 ' + fmtRate(o.netRecvPerSec) + ' \u00B7 \u2191 ' + fmtRate(o.netSentPerSec),
    'physical interfaces, loopback excluded',
    'Download/upload rate summed over physical interfaces (loopback excluded)',
    null, null, false,
    {key: 'ovNet', spark: () => histPoints('netRecvPerSec'), sparkColor: 'var(--blue)'});
  if (snap && snap.gpu) {
    const g = snap.gpu;
    const gu = mval(g.utilizationPercent);
    cards += kpiCard('GPU', gu != null ? fmtPct(gu) : 'Unavailable',
      (g.model && g.model.available) ? esc(g.model.value) :
        esc((g.utilizationPercent && g.utilizationPercent.unavailableReason) || ''),
      'GPU device utilization from IOKit AGXAccelerator PerformanceStatistics',
      gu != null ? gu : null, 'var(--blue)', gu == null, {key: 'ovGpu'});
  }
  if (snap && snap.battery) {
    const b = snap.battery;
    const bp = mval(b.chargePercent);
    if (bp != null) {
      cards += kpiCard('BATTERY', fmtPct(bp, 0),
        esc(mval(b.status) || '') +
          (mval(b.timeRemainingMinutes) != null ? ' · ' + mval(b.timeRemainingMinutes) + ' min' : ''),
        'Battery charge percentage (AppleSmartBattery)',
        bp, bp < 20 ? 'var(--red)' : bp < 50 ? 'var(--amber)' : 'var(--acc)',
        false, {key: 'ovBatt', sub: true});
    }
  }
  if (up != null) {
    cards += kpiCard('UPTIME', esc(up), 'since boot',
      'Time since the system booted (sysinfo boot_time)', null, null, false, {key: 'ovUp'});
  }
  if (la != null) {
    // One number in the headline; the other windows in the subtitle keeps
    // every card the same height and nothing wraps.
    cards += kpiCard('LOAD AVG', la.one.toFixed(2),
      '5m ' + la.five.toFixed(2) + ' \u00B7 15m ' + la.fifteen.toFixed(2),
      'Unix load averages (1-minute value; 5- and 15-minute in sub)',
      null, null, false,
      {key: 'ovLoad', sub: true, spark: () => histPoints('cpuPercent'), sparkColor: 'var(--acc)'});
  }
  cards += kpiCard('PROCESSES', String(o.processCount),
    'sample #' + o.sampleCount, 'Processes visible to this user',
    null, null, false, {key: 'ovProc', sub: true});

  // Machine identity — first-position card so the dashboard names its subject.
  {
    const host = snap && snap.host;
    const name = (host && host.hostName) || null;
    const osTxt = [host && host.osName, host && host.osVersion].filter(Boolean).join(' ');
    const kernel = host && host.kernelVersion ? 'kernel ' + host.kernelVersion : '';
    if (name || osTxt) {
      cards = kpiCard('MACHINE', esc(name || 'this device'),
        esc([osTxt, kernel].filter(Boolean).join(' · ') || 'platform details unavailable'),
        'Hostname and OS reported by sysinfo (read per sample)',
        null, null, false) + cards;
    }
  }

  return aiOverviewCard() +
    '<div class="kpis">' + cards + '</div>' +
    '<div class="grid grid-fill">' +
      card('CPU load', 'busy % across all cores', chartPlaceholder('ovCpu'), true) +
      card('Memory', 'used RAM and swap over time', chartPlaceholder('ovMem'), true) +
      card('Network', 'physical interfaces, loopback excluded', chartPlaceholder('ovNet'), true) +
      card('Disk', 'reads and writes per second', chartPlaceholder('ovDisk'), true) +
    '</div>' +
    '<script type="application/json" class="chart-registry">' + jsonSafe(JSON.stringify({
      ovCpu:  {series: hs.cpu, max: 100, fmtY: 'pctY', fmtVal: 'pctV', warn: 80},
      ovMem:  {series: hs.mem, fmtY: 'bytesY', fmtVal: 'bytesV'},
      ovNet:  {series: hs.net, fmtY: 'bytesY', fmtVal: 'rateV'},
      ovDisk: {series: hs.disk, fmtY: 'bytesY', fmtVal: 'rateV'},
    })) + '</scr' + 'ipt>';
}

/* Titles for the embedded console routes (same registry shape). */
const LOOP_TITLES = {
  console:   ['Loop Console', 'inference playground · conversations persist locally'],
  models:    ['Models & Providers', 'models the runtime genuinely supports'],
  traces:    ['Traces & Requests', 'durable record of every inference execution'],
  analytics: ['Analytics', 'computed from persisted traces'],
